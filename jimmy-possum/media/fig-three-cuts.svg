 stroke="#5b6e4f" stroke-width="8" stroke-linecap="round"/><circle cx="548.735138034237" cy="304.26548668333294" r="6.5" fill="#3d3128"/><line x1="442" y1="335" x2="476" y2="335" stroke="#a8442a" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/><path d="M476 335 A 34 34 0 0 0 475.0 326.8" fill="none" stroke="#a8442a" stroke-width="1.4"/><text x="450" y="309" font-size="10.5" fill="#a8442a" font-weight="bold">angle</text><text x="574" y="180" font-size="11.5" fill="#5b6e4f" font-weight="bold">drive from the</text><text x="574" y="195" font-size="11.5" fill="#5b6e4f" font-weight="bold">forearms</text><line x1="614" y1="202" x2="569" y2="306" stroke="#5b6e4f" stroke-width="1" marker-end="url(#ahg)"/><text x="532.0" y="414" text-anchor="middle" font-size="12.5" fill="#2b2118" font-weight="bold">handles up, skewed &amp; light,</text><text x="532.0" y="434" text-anchor="middle" font-size="12.5" fill="#2b2118" font-weight="normal">from the forearms</text><text x="532.0" y="454" text-anchor="middle" font-size="12.5" fill="#a8442a" font-weight="normal">— with the grain</text><rect x="704" y="96" width="320" height="400" rx="10" fill="none" stroke="#c39f6f" stroke-width="1.4" opacity="0.8"/><text x="864.0" y="126" text-anchor="middle" font-size="18" fill="#2b2118" font-weight="bold">3 · Fitting</text><text x="864.0" y="146" text-anchor="middle" font-size="12.5" fill="#5a4a3a" font-style="italic">dialing a tenon</text><rect x="728" y="334" width="150" height="24" rx="3" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><polygon points="728,334 716,327 716,351 728,358" fill="#c39f6f" stroke="#2b2118" stroke-width="1.6"/><polygon points="728,334 716,327 866,327 878,334" fill="#d9b98a" stroke="#2b2118" stroke-width="1.2"/><line x1="733" y1="340" x2="873" y2="340" stroke="#c39f6f" stroke-width="0.8" opacity="0.6"/><line x1="733" y1="346" x2="873" y2="346" stroke="#c39f6f" stroke-width="0.8" opacity="0.6"/><line x1="733" y1="352" x2="873" y2="352" stroke="#c39f6f" stroke-width="0.8" opacity="0.6"/><rect x="748" y="358" width="46" height="13" rx="3" fill="#d9b98a" stroke="#2b2118" stroke-width="1.4"/><path d="M774 335 q -20 -6 -38 -8" fill="none" stroke="#5a4a3a" stroke-width="1.1"/><polygon points="775.0,327.8 850.3,317.2 852.2,331.1 777.0,341.7" fill="#9aa0a6" stroke="#2b2118" stroke-width="1.5"/><polygon points="774.0,335.0 791.0,326.6 792.8,339.4" fill="#7c8288" stroke="#2b2118" stroke-width="1.1"/><line x1="800.2" y1="325.3" x2="808.8" y2="336.2" stroke="#5a4a3a" stroke-width="0.9" opacity="0.7"/><line x1="815.6" y1="323.1" x2="824.2" y2="334.0" stroke="#5a4a3a" stroke-width="0.9" opacity="0.7"/><line x1="831.1" y1="320.9" x2="839.7" y2="331.8" stroke="#5a4a3a" stroke-width="0.9" opacity="0.7"/><line x1="851.2" y1="324.1" x2="875.6" y2="296.5" stroke="#8a6b4a" stroke-width="8.0" stroke-linecap="round"/><line x1="851.2" y1="324.1" x2="883.4" y2="315.6" stroke="#6b4f33" stroke-width="10.0" stroke-linecap="round"/><circle cx="883.4" cy="315.6" r="5.5" fill="#6b4f33" stroke="#2b2118" stroke-width="1"/><circle cx="875.6" cy="296.5" r="4.5" fill="#8a6b4a" stroke="#2b2118" stroke-width="1"/><line x1="987.363063226474" y1="399.59071351846643" x2="1025.363063226474" y2="415.59071351846643" stroke="#5a4a3a" stroke-width="12" stroke-linecap="round"/><line x1="1025.363063226474" y1="415.59071351846643" x2="1019.363063226474" y2="465.59071351846643" stroke="#5a4a3a" stroke-width="10" stroke-linecap="round"/><line x1="987.363063226474" y1="399.59071351846643" x2="1033.363063226474" y2="411.59071351846643" stroke="#3d3128" stroke-width="13" stroke-linecap="round"/><line x1="1033.363063226474" y1="411.59071351846643" x2="1033.363063226474" y2="465.59071351846643" stroke="#3d3128" stroke-width="11" stroke-linecap="round"/><line x1="987.363063226474" y1="399.59071351846643" x2="975.363063226474" y2="309.59071351846643" stroke="#3d3128" stroke-width="22" stroke-linecap="round"/><circle cx="969.363063226474" cy="281.59071351846643" r="13" fill="#3d3128"/><line x1="975.363063226474" y1="309.59071351846643" x2="923.363063226474" y2="331.59071351846643" stroke="#3d3128" stroke-width="9" stroke-linecap="round"/><line x1="923.363063226474" y1="331.59071351846643" x2="883.363063226474" y2="315.59071351846643" stroke="#3d3128" stroke-width="8" stroke-linecap="round"/><circle cx="883.363063226474" cy="315.59071351846643" r="6.5" fill="#5b6e4f"/><line x1="774" y1="335" x2="808" y2="335" stroke="#a8442a" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/><path d="M808 335 A 34 34 0 0 0 807.7 330.3" fill="none" stroke="#a8442a" stroke-width="1.4"/><text x="782" y="309" font-size="10.5" fill="#a8442a" font-weight="bold">angle</text><text x="906" y="180" font-size="11.5" fill="#5b6e4f" font-weight="bold">drive from the</text><text x="906" y="195" font-size="11.5" fill="#5b6e4f" font-weight="bold">wrists</text><line x1="946" y1="202" x2="883" y2="310" stroke="#5b6e4f" stroke-width="1" marker-end="url(#ahg)"/><text x="864.0" y="414" text-anchor="middle" font-size="12.5" fill="#2b2118" font-weight="bold">feather-light, heavy skew,</text><text x="864.0" y="434" text-anchor="middle" font-size="12.5" fill="#2b2118" font-weight="normal">from the wrists</text><text x="864.0" y="454" text-anchor="middle" font-size="12.5" fill="#a8442a" font-weight="normal">— shaving tenths, not shapes</text><text x="520.0" y="582" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">Lower the handles to bite; raise them and skew to ride the fibers; feather the pressure to fit.</text><text x="520.0" y="604" text-anchor="middle" font-size="12" fill="#5a4a3a" font-style="italic">As the cut gets finer, the angle of attack flattens, the skew steepens, and the motion moves out toward the fingertips — bevel-down the whole way.</text><text x="520.0" y="642" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">After Peter Galbert, “Chairmaker’s Notebook,” Ch. 9–10.</text></svg>