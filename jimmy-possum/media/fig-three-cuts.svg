 139.4 318.0" fill="none" stroke="#a8442a" stroke-width="1.4"/><text x="118" y="309" font-size="10.5" fill="#a8442a" font-weight="bold">angle</text><text x="242" y="180" font-size="11.5" fill="#5b6e4f" font-weight="bold">drive from the</text><text x="242" y="195" font-size="11.5" fill="#5b6e4f" font-weight="bold">shoulders</text><line x1="282" y1="202" x2="270" y2="275" stroke="#5b6e4f" stroke-width="1" marker-end="url(#ahg)"/><text x="200.0" y="414" text-anchor="middle" font-size="12.5" fill="#2b2118" font-weight="bold">handles down, bite deep,</text><text x="200.0" y="434" text-anchor="middle" font-size="12.5" fill="#2b2118" font-weight="normal">drive from the shoulders</text><text x="200.0" y="454" text-anchor="middle" font-size="12.5" fill="#a8442a" font-weight="normal">— into the hillside</text><rect x="372" y="96" width="320" height="400" rx="10" fill="none" stroke="#c39f6f" stroke-width="1.4" opacity="0.8"/><text x="532.0" y="126" text-anchor="middle" font-size="18" fill="#2b2118" font-weight="bold">2 · Refining</text><text x="532.0" y="146" text-anchor="middle" font-size="12.5" fill="#5a4a3a" font-style="italic">finishing</text><rect x="396" y="334" width="150" height="24" rx="3" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><polygon points="396,334 384,327 384,351 396,358" fill="#c39f6f" stroke="#2b2118" stroke-width="1.6"/><polygon points="396,334 384,327 534,327 546,334" fill="#d9b98a" stroke="#2b2118" stroke-width="1.2"/><line x1="401" y1="340" x2="541" y2="340" stroke="#c39f6f" stroke-width="0.8" opacity="0.6"/><line x1="401" y1="346" x2="541" y2="346" stroke="#c39f6f" stroke-width="0.8" opacity="0.6"/><line x1="401" y1="352" x2="541" y2="352" stroke="#c39f6f" stroke-width="0.8" opacity="0.6"/><rect x="416" y="358" width="46" height="13" rx="3" fill="#d9b98a" stroke="#2b2118" stroke-width="1.4"/><path d="M442 335 q -22 -12 -42 -16 q 16 -3 31 5 q -3 5 11 11 Z" fill="#faf4e8" stroke="#5a4a3a" stroke-width="1.1"/><polygon points="442.2,327.7 516.0,309.