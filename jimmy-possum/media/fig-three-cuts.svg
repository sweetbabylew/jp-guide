<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 644" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="1040" height="644" fill="#faf4e8"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker><marker id="ahg" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6e4f"/></marker></defs><text x="520.0" y="40" text-anchor="middle" font-size="25" fill="#2b2118" font-weight="bold">Three Cuts, One Knife</text><text x="520.0" y="66" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">Same drawknife, always bevel-down — you change the angle of attack, the grip, and which part of the body drives the pull</text><rect x="40" y="96" width="320" height="400" rx="10" fill="none" stroke="#c39f6f" stroke-width="1.4" opacity="0.8"/><text x="200.0" y="126" text-anchor="middle" font-size="18" fill="#2b2118" font-weight="bold">1 · Roughing</text><text x="200.0" y="146" text-anchor="middle" font-size="12.5" fill="#5a4a3a" font-style="italic">heavy shaping</text><rect x="64" y="334" width="150" height="24" rx="3" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><polygon points="64,334 52,327 52,351 64,358" fill="#c39f6f" stroke="#2b2118" stroke-width="1.6"/><polygon points="64,334 52,327 202,327 214,334" fill="#d9b98a" stroke="#2b2118" stroke-width="1.2"/><line x1="69" y1="340" x2="209" y2="340" stroke="#c39f6f" stroke-width="0.8" opacity="0.6"/><line x1="69" y1="346" x2="209" y2="346" stroke="#c39f6f" stroke-width="0.8" opacity="0.6"/><line x1="69" y1="352" x2="209" y2="352" stroke="#c39f6f" stroke-width="0.8" opacity="0.6"/><rect x="84" y="358" width="46" height="13" rx="3" fill="#d9b98a" stroke="#2b2118" stroke-width="1.4"/><path d="M110 335 q -24 -20 -46 -12 q 17 -16 35 -6 q -4 6 11 18 Z" fill="#ead8b8" stroke="#2b2118" stroke-width="1.4"/><polygon points="108.2,327.9 174.0