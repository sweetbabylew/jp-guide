<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="900" height="560" fill="#faf4e8"/><defs><marker id="ahr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker></defs><text x="450.0" y="38" text-anchor="middle" font-size="24" fill="#2b2118" font-weight="bold">Shaving Parts: the Shavehorse &amp; Drawknife</text><text x="450.0" y="62" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">Sit astride, push the treadle to clamp, and draw the knife toward you in long, slicing strokes</text><line x1="150" y1="472" x2="760" y2="472" stroke="#5a4a3a" stroke-width="1.5" opacity="0.4"/><line x1="243" y1="316" x2="363" y2="342" stroke="#5a4a3a" stroke-width="13" stroke-linecap="round"/><line x1="363" y1="342" x2="490" y2="448" stroke="#5a4a3a" stroke-width="11" stroke-linecap="round"/><ellipse cx="494" cy="450" rx="12" ry="5" fill="#5a4a3a"/><line x1="266" y1="180" x2="312" y2="225" stroke="#5a4a3a" stroke-width="9" stroke-linecap="round"/><line x1="312" y1="225" x2="354" y2="246" stroke="#5a4a3a" stroke-width="9" stroke-linecap="round"/><polygon points="264,356 276,356 225,472 211,472" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><polygon points="264,356 276,356 329,472 315,472" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><polygon points="604,356 616,356 565,472 551,472" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><polygon points="604,356 616,356 669,472 655,472" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><rect x="195" y="328" width="490" height="30" rx="5" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><rect x="496" y="326" width="18" height="34" fill="#faf4e8" stroke="#5a4a3a" stroke-width="1"/><line x1="505" y1="348" x2="482" y2="262" stroke="#c39f6f" stroke-width="15" stroke-linecap="round"/><line x1="505" y1="348" x2="520" y2="452" stroke="#c39f6f" stroke-width="15" stroke-linecap="round"/><rect x="484" y="450" width="76" height="16" rx="4" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><circle cx="505" cy="344" r="4" fill="#2b2118"/><rect x="355" y="300" width="115" height="28" rx="4" fill="#d9b98a" stroke="#2b2118" stroke-width="2"/><rect x="270" y="286" width="262" height="14" rx="3" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><rect x="444" y="244" width="72" height="42" rx="6" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><polygon points="346,287 400,276 400,284 346,295" fill="#9aa0a6" stroke="#2b2118" stroke-width="1.5"/><line x1="398" y1="278" x2="358" y2="248" stroke="#8a6b4a" stroke-width="9" stroke-linecap="round"/><line x1="348" y1="291" x2="306" y2="288" stroke="#6b4f33" stroke-width="11" stroke-linecap="round"/><line x1="250" y1="318" x2="263" y2="185" stroke="#3d3128" stroke-width="26" stroke-linecap="round"/><circle cx="272" cy="152" r="15" fill="#3d3128"/><line x1="258" y1="190" x2="298" y2="248" stroke="#3d3128" stroke-width="10" stroke-linecap="round"/><line x1="298" y1="248" x2="303" y2="283" stroke="#3d3128" stroke-width="10" stroke-linecap="round"/><circle cx="304" cy="287" r="7.5" fill="#3d3128"/><circle cx="356" cy="247" r="7" fill="#5a4a3a"/><line x1="255" y1="318" x2="378" y2="348" stroke="#3d3128" stroke-width="14" stroke-linecap="round"/><line x1="378" y1="348" x2="502" y2="443" stroke="#3d3128" stroke-width="12" stroke-linecap="round"/><ellipse cx="507" cy="446" rx="13" ry="6" fill="#3d3128"/><line x1="430" y1="138" x2="362" y2="138" stroke="#a8442a" stroke-width="3" marker-end="url(#ahr)"/><text x="438" y="143" font-size="12.5" fill="#a8442a" font-weight="bold">pull toward you</text><text x="378" y="164" font-size="12" fill="#2b2118">drawknife (two handles)</text><line x1="390" y1="170" x2="380" y2="256" stroke="#5a4a3a" stroke-width="1"/><text x="560" y="190" font-size="12" fill="#2b2118">dumbhead — swing arm,</text><text x="560" y="206" font-size="12" fill="#2b2118">pivots through the bench</text><line x1="556" y1="198" x2="518" y2="248" stroke="#5a4a3a" stroke-width="1"/><text x="566" y="282" font-size="10.5" fill="#5a4a3a">stick protrudes</text><text x="566" y="298" font-size="10.5" fill="#5a4a3a">through the head</text><line x1="562" y1="290" x2="536" y2="292" stroke="#5a4a3a" stroke-width="1"/><text x="546" y="380" font-size="10.5" fill="#5a4a3a">pivot pin</text><line x1="544" y1="375" x2="511" y2="350" stroke="#5a4a3a" stroke-width="1"/><line x1="548" y1="420" x2="548" y2="444" stroke="#a8442a" stroke-width="2.5" marker-end="url(#ahr)"/><text x="470" y="500" font-size="12" fill="#2b2118">foot treadle</text><line x1="500" y1="490" x2="512" y2="468" stroke="#5a4a3a" stroke-width="1"/><text x="470" y="520" font-size="12" fill="#a8442a">push down = jaw grips harder</text><text x="450.0" y="546" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">“Why not keep on going and shave the entire chair?” — Joyce Alexander to Jennie Alexander, 1978</text></svg>