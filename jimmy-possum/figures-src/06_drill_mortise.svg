h="2" stroke-dasharray="4,4"/><line x1="620" y1="280" x2="620" y2="170" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="2,3"/><path d="M620 225 A 55 55 0 0 0 599 229" fill="none" stroke="#2b2118" stroke-width="1.4"/><text x="600" y="216" font-size="13" fill="#a8442a" font-weight="bold">resultant°</text><line x1="620" y1="280" x2="564" y2="141" stroke="#8a8f94" stroke-width="6"/><circle cx="620" cy="280" r="4" fill="#2b2118"/><path d="M561.8090109876132 140.92242181498187 q -34 -10 -20 -40 q 14 -26 44 -14" fill="none" stroke="#2b2118" stroke-width="5"/><circle cx="523.8090109876132" cy="110.92242181498187" r="9" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><text x="493.8090109876132" y="96.92242181498187" font-size="12.5" fill="#2b2118">brace &amp; auger bit</text><line x1="770" y1="280" x2="770" y2="190" stroke="#2b2118" stroke-width="5"/><line x1="770" y1="280" x2="734" y2="192" stroke="#9aa0a6" stroke-width="4"/><text x="778" y="220" font-size="12" fill="#2b2118">bevel gauge</text><text x="766" y="298" font-size="11" fill="#5a4a3a">set to resultant</text><text x="450.0" y="514" text-anchor="middle" font-size="14" fill="#2b2118" font-weight="bold">Two angles, one move</text><text x="450.0" y="536" text-anchor="middle" font-size="12.5" fill="#5a4a3a"><tspan font-weight="bold">Rake</tspan> (front/back lean) and <tspan font-weight="bold">splay</tspan> (side lean) combine into one <tspan fill="#a8442a" font-weight="bold">resultant</tspan> tilt,</text><text x="450.0" y="554" text-anchor="middle" font-size="12.5" fill="#5a4a3a">aimed along a <tspan fill="#a8442a">sightline</tspan>. Set the bevel to the resultant, sight down the line, and bore.</text><text x="450.0" y="572" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">JP back legs rake ~20–30°. You don&#39;t need to hit a degree exactly — the comb pulls strays into line. (Lewis&#39;s notes; Schwarz)</text></svg>