<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="900" height="600" fill="#faf4e8"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker></defs><text x="450.0" y="36" text-anchor="middle" font-size="23" fill="#2b2118" font-weight="bold">Drilling the Outer Back Sticks — Seat &amp; Arm Together</text><text x="450.0" y="60" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">Clamp the arms UNDER the seat, centerlines aligned with the side layout lines, and bore both in one pass</text><text x="245" y="92" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">Plan — line up the arms</text><rect x="90" y="110" width="300" height="250" rx="4" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><rect x="110" y="96" width="40" height="310" rx="3" fill="#d9b98a" fill-opacity="0.55" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="2,3"/><line x1="130" y1="100" x2="130" y2="402" stroke="#5b6e4f" stroke-width="2"/><rect x="330" y="96" width="40" height="310" rx="3" fill="#d9b98a" fill-opacity="0.55" stroke="#5a4a3a" stroke-width="1.5" stroke-dasharray="2,3"/><line x1="350" y1="100" x2="350" y2="402" stroke="#5b6e4f" stroke-width="2"/><line x1="130" y1="110" x2="130" y2="360" stroke="#a8442a" stroke-width="1.6" stroke-dasharray="5,4"/><line x1="350" y1="110" x2="350" y2="360" stroke="#a8442a" stroke-width="1.6" stroke-dasharray="5,4"/><line x1="90" y1="144" x2="390" y2="144" stroke="#a8442a" stroke-width="1.6" stroke-dasharray="5,4"/><text x="398" y="120" font-size="10.5" fill="#2b2118" font-weight="bold">BACK</text><text x="398" y="356" font-size="10.5" fill="#2b2118" font-weight="bold">FRONT</text><circle cx="130" cy="144" r="6" fill="#c39f6f" stroke="#2b2118" stroke-width="1.6"/><circle cx="350" cy="144" r="6" fill="#c39f6f" stroke="#2b2118" stroke-width="1.6"/><text x="240.0" y="184" text-anchor="middle" font-size="11" fill="#a8442a">hole center — where the lines cross</text><line x1="170.0" y1="172" x2="138" y2="152" stroke="#a8442a" stroke-width="1" marker-end="url(#ahr)"/><line x1="310.0" y1="172" x2="342" y2="152" stroke="#a8442a" stroke-width="1" marker-end="url(#ahr)"/><text x="240.0" y="424" text-anchor="middle" font-size="11.5" fill="#a8442a">red dashes = seat layout lines, 1½″ in from each edge</text><text x="240.0" y="440" text-anchor="middle" font-size="11.5" fill="#5b6e4f">green = arm centerlines (arms below the seat)</text><text x="240.0" y="456" text-anchor="middle" font-size="11.5" fill="#5a4a3a">align each arm to the seat&#39;s side line; arms run past front &amp; back</text><text x="650" y="96" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">Section — bore through both</text><rect x="470" y="220" width="300" height="30" rx="3" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><text x="700" y="240" text-anchor="middle" font-size="11.5" fill="#5a4a3a">seat</text><text x="440" y="208" text-anchor="middle" font-size="11.5" fill="#2b2118" font-weight="bold">BACK</text><text x="770" y="208" text-anchor="middle" font-size="11.5" fill="#2b2118" font-weight="bold">FRONT</text><rect x="444" y="250" width="418" height="24" rx="3" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><text x="862" y="292" text-anchor="end" font-size="10.5" fill="#5a4a3a">overlong — slack runs past the front</text><text x="440" y="266.0" text-anchor="end" font-size="11.5" fill="#2b2118">arm</text><line x1="444" y1="242" x2="470" y2="242" stroke="#a8442a" stroke-width="1" marker-start="url(#ahr)" marker-end="url(#ahr)"/><text x="457.0" y="238" text-anchor="middle" font-size="10" fill="#a8442a">1″</text><rect x="458" y="274" width="92" height="14" rx="2" fill="#e7d9bf" stroke="#5a4a3a" stroke-width="1.4" stroke-dasharray="3,2"/><text x="504" y="301" text-anchor="middle" font-size="10.5" fill="#5a4a3a">scrap plywood (stops blow-out)</text><line x1="504" y1="274" x2="482" y2="180" stroke="#8a8f94" stroke-width="6"/><circle cx="504" cy="274" r="3.5" fill="#2b2118"/><rect x="624" y="212" width="13" height="70" rx="3" fill="none" stroke="#2b2118" stroke-width="2.4"/><rect x="618" y="212" width="25" height="7" fill="#5a4a3a"/><rect x="618" y="275" width="25" height="7" fill="#5a4a3a"/><text x="630" y="204" text-anchor="middle" font-size="10.5" fill="#5a4a3a">clamp</text><line x1="504" y1="274" x2="504" y2="168" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="2,3"/><path d="M504 214 A 40 40 0 0 0 495 214" fill="none" stroke="#a8442a" stroke-width="1.3"/><text x="510" y="192" font-size="12.5" fill="#a8442a" font-weight="bold">rake 9–17°</text><text x="480" y="172" text-anchor="middle" font-size="11.5" fill="#2b2118">1″ bit, sighted along the line</text><text x="450.0" y="514" text-anchor="middle" font-size="14" fill="#2b2118" font-weight="bold">One bore, two parts — they line up forever</text><text x="450.0" y="536" text-anchor="middle" font-size="12.5" fill="#5a4a3a">Hole center = the rear-corner intersection of the layout lines. Sight the rake ALONG the side line (no splay).</text><text x="450.0" y="554" text-anchor="middle" font-size="12.5" fill="#5a4a3a">Choose the rake for the chair&#39;s use: 9° upright and dining, toward 17° for a relaxed, reclined sitter.</text><text x="450.0" y="578" text-anchor="middle" font-size="11.5" fill="#5a4a3a" font-style="italic">Always clamp scrap under the exit face to stop blow-out.</text></svg>