<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="900" height="470" fill="#faf4e8"/><defs><marker id="ah" markerWidth="11" markerHeight="11" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker></defs><text x="450.0" y="42" text-anchor="middle" font-size="24" fill="#2b2118" font-weight="bold">Order of Assembly (and Disassembly)</text><text x="450.0" y="68" text-anchor="middle" font-size="13.5" fill="#5a4a3a" font-style="italic">Always put the chair together — and take it apart — in the order it was built</text><rect x="51.0" y="170" width="118" height="86" rx="12" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><circle cx="73.0" cy="192" r="14" fill="#a8442a"/><text x="73.0" y="197" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">1</text><text x="110.0" y="224" text-anchor="middle" font-size="14" fill="#2b2118">Outer</text><text x="110.0" y="242" text-anchor="middle" font-size="14" fill="#2b2118">back sticks</text><line x1="171.0" y1="213.0" x2="185.0" y2="213.0" stroke="#a8442a" stroke-width="3" marker-end="url(#ah)"/><rect x="187.0" y="170" width="118" height="86" rx="12" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><circle cx="209.0" cy="192" r="14" fill="#a8442a"/><text x="209.0" y="197" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">2</text><text x="246.0" y="224" text-anchor="middle" font-size="14" fill="#2b2118">Arm</text><line x1="307.0" y1="213.0" x2="321.0" y2="213.0" stroke="#a8442a" stroke-width="3" marker-end="url(#ah)"/><rect x="323.0" y="170" width="118" height="86" rx="12" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><circle cx="345.0" cy="192" r="14" fill="#a8442a"/><text x="345.0" y="197" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">3</text><text x="382.0" y="224" text-anchor="middle" font-size="14" fill="#2b2118">Front leg</text><line x1="443.0" y1="213.0" x2="457.0" y2="213.0" stroke="#a8442a" stroke-width="3" marker-end="url(#ah)"/><rect x="459.0" y="170" width="118" height="86" rx="12" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><circle cx="481.0" cy="192" r="14" fill="#a8442a"/><text x="481.0" y="197" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">4</text><text x="518.0" y="224" text-anchor="middle" font-size="14" fill="#2b2118">Back leg</text><line x1="579.0" y1="213.0" x2="593.0" y2="213.0" stroke="#a8442a" stroke-width="3" marker-end="url(#ah)"/><rect x="595.0" y="170" width="118" height="86" rx="12" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><circle cx="617.0" cy="192" r="14" fill="#a8442a"/><text x="617.0" y="197" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">5</text><text x="654.0" y="224" text-anchor="middle" font-size="14" fill="#2b2118">Remaining</text><text x="654.0" y="242" text-anchor="middle" font-size="14" fill="#2b2118">back sticks</text><line x1="715.0" y1="213.0" x2="729.0" y2="213.0" stroke="#a8442a" stroke-width="3" marker-end="url(#ah)"/><rect x="731.0" y="170" width="118" height="86" rx="12" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><circle cx="753.0" cy="192" r="14" fill="#a8442a"/><text x="753.0" y="197" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">6</text><text x="790.0" y="224" text-anchor="middle" font-size="14" fill="#2b2118">Comb</text><text x="450.0" y="306" text-anchor="middle" font-size="13.5" fill="#2b2118" font-weight="bold">To take it apart, reverse the order: comb first, then sticks, back leg, front leg, arm, outer sticks last.</text><text x="450.0" y="336" text-anchor="middle" font-size="14" fill="#5b6e4f" font-weight="bold">Pinning &amp; wedging</text><text x="450.0" y="360" text-anchor="middle" font-size="12.5" fill="#5a4a3a">Loose leg-to-seat joint? Pin with a trenail or dowel on the long-grain side.</text><text x="450.0" y="380" text-anchor="middle" font-size="12.5" fill="#5a4a3a">Leg-to-arm joints: pin, wedge, or both.   ·   Comb: wedge only if its tenons aren't already tight.</text><text x="450.0" y="400" text-anchor="middle" font-size="12.5" fill="#5a4a3a">Do NOT pin the arm to the back stick.   ·   Tenons may be cut flush or left proud and stylized.</text></svg>