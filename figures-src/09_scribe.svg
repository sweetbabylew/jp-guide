<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="920" height="620" fill="#faf4e8"/><text x="460.0" y="38" text-anchor="middle" font-size="24" fill="#2b2118" font-weight="bold">Leveling the Legs After Assembly</text><text x="460.0" y="64" text-anchor="middle" font-size="13.5" fill="#5a4a3a" font-style="italic">Stand the chair on a flat surface, shim it level, then scribe every leg at one height and saw to the line</text><rect x="90" y="470" width="740" height="24" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><text x="460" y="512" text-anchor="middle" font-size="12" fill="#5a4a3a">flat reference surface (benchtop / floor)</text><polygon points="317.5,317.0 461.5,327.5 461.5,341.0 317.5,330.5" fill="#ead8b8" stroke="#2b2118" stroke-width="2.1"/><polygon points="324.6,242.0 325.4,228.5 476.9,237.4 476.1,250.8" fill="#ead8b8" stroke="#2b2118" stroke-width="1.9"/><polygon points="329.5,470.0 310.0,470.0 333.6,216.8 343.3,217.6" fill="#d9b98a" stroke="#2b2118" stroke-width="1.9"/><polygon points="492.7,458.0 471.0,458.0 360.7,221.7 370.1,217.1" fill="#d9b98a" stroke="#2b2118" stroke-width="1.9"/><polygon points="447.0,350.8 438.2,348.8 493.4,109.7 502.2,111.8" fill="#d9b98a" stroke="#2b2118" stroke-width="1.9"/><polygon points="486.3,119.7 484.7,110.1 510.2,105.8 511.8,115.4" fill="#c39f6f" stroke="#2b2118" stroke-width="1.9"/><polygon points="334.0,216.2 343.0,216.2 340.5,227.2 336.5,227.2" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><polygon points="360.9,218.4 369.9,218.4 367.4,229.4 363.4,229.4" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><polygon points="466.3,227.0 475.3,227.0 472.8,237.0 468.8,237.0" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><text x="250" y="168" text-anchor="middle" font-size="11.5" fill="#5a4a3a">assembled chair &#8212; side view (front at left)</text><polygon points="457.7,470 505.7,470 499.7,458 463.7,458" fill="#5b6e4f" fill-opacity="0.55" stroke="#5b6e4f" stroke-width="1.4"/><text x="516" y="467" font-size="10.5" fill="#5b6e4f">shim to level</text><line x1="250" y1="440" x2="616" y2="440" stroke="#a8442a" stroke-width="1" stroke-dasharray="4,5" opacity="0.8"/><text x="242" y="444" text-anchor="end" font-size="12" fill="#a8442a" font-weight="bold">scribe line</text><line x1="310" y1="440" x2="334" y2="440" stroke="#a8442a" stroke-width="2.5"/><line x1="315" y1="445" x2="329" y2="441" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="314" y1="451" x2="328" y2="447" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="314" y1="457" x2="328" y2="453" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="313" y1="463" x2="327" y2="459" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="461" y1="440" x2="485" y2="440" stroke="#a8442a" stroke-width="2.5"/><line x1="468" y1="445" x2="482" y2="441" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="471" y1="451" x2="485" y2="447" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><text x="398" y="464" text-anchor="middle" font-size="10.5" fill="#5a4a3a">saw off below the line</text><rect x="640" y="444" width="80" height="26" rx="4" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><text x="680" y="462" text-anchor="middle" font-size="10" fill="#2b2118">block</text><rect x="640" y="433" width="58" height="11" fill="#caa24a" stroke="#2b2118" stroke-width="1.1"/><line x1="642" y1="436.6" x2="696" y2="436.6" stroke="#2b2118" stroke-width="0.5" opacity="0.5"/><line x1="642" y1="440.4" x2="696" y2="440.4" stroke="#2b2118" stroke-width="0.5" opacity="0.5"/><rect x="698" y="433" width="7" height="11" fill="#c39f6f" stroke="#2b2118" stroke-width="1"/><polygon points="640,433 640,444 622,438.5" fill="#ead8b8" stroke="#2b2118" stroke-width="1"/><polygon points="627,436.9 627,440.1 620,438.5" fill="#2b2118"/><text x="734" y="430" font-size="11" fill="#2b2118">pencil on a block</text><text x="734" y="446" font-size="11" fill="#2b2118">= fixed height</text><text x="460.0" y="564" text-anchor="middle" font-size="14" fill="#2b2118" font-weight="bold">Level first, then scribe</text><text x="460.0" y="584" text-anchor="middle" font-size="12.5" fill="#5a4a3a">Shim the feet until the seat sits level (side to side) at the recline you want. Then rest a pencil on a block on the</text><text x="460.0" y="602" text-anchor="middle" font-size="12.5" fill="#5a4a3a">surface and run it around each leg; saw to the line, and all four feet meet the floor together.</text></svg>