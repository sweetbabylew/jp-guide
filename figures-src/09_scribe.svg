<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="920" height="580" fill="#faf4e8"/><text x="460.0" y="38" text-anchor="middle" font-size="24" fill="#2b2118" font-weight="bold">Leveling the Legs After Assembly</text><text x="460.0" y="64" text-anchor="middle" font-size="13.5" fill="#5a4a3a" font-style="italic">Stand the chair on a flat surface, shim it level, then scribe every leg at one height and saw to the line</text><rect x="90" y="430" width="740" height="26" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><text x="460" y="476" text-anchor="middle" font-size="12" fill="#5a4a3a">flat reference surface (benchtop / floor)</text><line x1="406" y1="251" x2="376" y2="119" stroke="#d9b98a" stroke-width="9" stroke-linecap="round" opacity="0.35"/><text x="352" y="136" text-anchor="end" font-size="10.5" fill="#5a4a3a" opacity="0.7">back sticks</text><polygon points="390,254 566,248 566,264 390,270" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><text x="478" y="106" text-anchor="middle" font-size="11.5" fill="#5a4a3a">assembled chair — side view (front at right)</text><polygon points="543.0,264.2 556.0,263.8 563.0,429.7 546.0,430.3" fill="#d9b98a" stroke="#2b2118" stroke-width="2"/><polygon points="435.2,266.2 446.8,271.8 376.9,419.7 361.7,412.3" fill="#d9b98a" stroke="#2b2118" stroke-width="2"/><polygon points="346,430 402,430 402,416 358,416" fill="#5b6e4f" fill-opacity="0.55" stroke="#5b6e4f" stroke-width="1.4"/><text x="336" y="424" text-anchor="end" font-size="10.5" fill="#5b6e4f">shim to level</text><line x1="330" y1="393" x2="690" y2="393" stroke="#a8442a" stroke-width="1" stroke-dasharray="4,5" opacity="0.75"/><text x="322" y="388" text-anchor="end" font-size="12" fill="#a8442a" font-weight="bold">scribe line</text><line x1="367" y1="393" x2="395" y2="393" stroke="#a8442a" stroke-width="2.5"/><line x1="370" y1="398" x2="386" y2="394" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="367" y1="404" x2="383" y2="400" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="364" y1="410" x2="380" y2="406" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="539" y1="393" x2="567" y2="393" stroke="#a8442a" stroke-width="2.5"/><line x1="546" y1="398" x2="562" y2="394" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="546" y1="404" x2="562" y2="400" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="546" y1="410" x2="562" y2="406" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="546" y1="416" x2="562" y2="412" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="546" y1="422" x2="562" y2="418" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><line x1="546" y1="428" x2="562" y2="424" stroke="#5a4a3a" stroke-width="0.7" opacity="0.65"/><text x="468" y="414" text-anchor="middle" font-size="10.5" fill="#5a4a3a">saw off below the line</text><rect x="600" y="398" width="80" height="32" rx="4" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><text x="640" y="419" text-anchor="middle" font-size="10" fill="#2b2118">block</text><rect x="600" y="387" width="58" height="11" fill="#caa24a" stroke="#2b2118" stroke-width="1.1"/><line x1="602" y1="390.6" x2="656" y2="390.6" stroke="#2b2118" stroke-width="0.5" opacity="0.5"/><line x1="602" y1="394.4" x2="656" y2="394.4" stroke="#2b2118" stroke-width="0.5" opacity="0.5"/><rect x="658" y="387" width="7" height="11" fill="#c39f6f" stroke="#2b2118" stroke-width="1"/><polygon points="600,387 600,398 582,392.5" fill="#ead8b8" stroke="#2b2118" stroke-width="1"/><polygon points="587,390.9 587,394.1 580,392.5" fill="#2b2118"/><text x="694" y="388" font-size="11" fill="#2b2118">pencil on a block</text><text x="694" y="404" font-size="11" fill="#2b2118">= fixed height</text><text x="460.0" y="522" text-anchor="middle" font-size="14" fill="#2b2118" font-weight="bold">Level first, then scribe</text><text x="460.0" y="542" text-anchor="middle" font-size="12.5" fill="#5a4a3a">Shim the feet until the seat sits level (side to side) at the recline you want. Then rest a pencil on a block on the</text><text x="460.0" y="560" text-anchor="middle" font-size="12.5" fill="#5a4a3a">surface and run it around each leg; saw to the line, and all four feet meet the floor together.</text></svg>