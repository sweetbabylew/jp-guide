<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="900" height="600" fill="#faf4e8"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto-start-reverse"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker></defs><text x="450.0" y="40" text-anchor="middle" font-size="24" fill="#2b2118" font-weight="bold">Riving Chair Parts with a Froe</text><text x="450.0" y="64" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">Side view: the billet lies horizontal in the riving brake — the club seats the froe into the end grain, then the handle levers up and down</text><line x1="838" y1="448" x2="723" y2="180" stroke="#6b4f33" stroke-width="14" stroke-linecap="round"/><rect x="370" y="258" width="442" height="104" rx="4" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><rect x="370" y="258" width="16" height="104" fill="#c39f6f" stroke="#5a4a3a" stroke-width="1"/><line x1="373" y1="268" x2="383" y2="268" stroke="#5a4a3a" stroke-width="0.7"/><line x1="373" y1="280" x2="383" y2="280" stroke="#5a4a3a" stroke-width="0.7"/><line x1="373" y1="292" x2="383" y2="292" stroke="#5a4a3a" stroke-width="0.7"/><line x1="373" y1="304" x2="383" y2="304" stroke="#5a4a3a" stroke-width="0.7"/><line x1="373" y1="316" x2="383" y2="316" stroke="#5a4a3a" stroke-width="0.7"/><line x1="373" y1="328" x2="383" y2="328" stroke="#5a4a3a" stroke-width="0.7"/><line x1="373" y1="340" x2="383" y2="340" stroke="#5a4a3a" stroke-width="0.7"/><line x1="373" y1="352" x2="383" y2="352" stroke="#5a4a3a" stroke-width="0.7"/><line x1="395" y1="278" x2="445" y2="278" stroke="#5a4a3a" stroke-width="0.9" opacity="0.28"/><line x1="680" y1="278" x2="795" y2="278" stroke="#5a4a3a" stroke-width="0.9" opacity="0.28"/><line x1="395" y1="344" x2="795" y2="344" stroke="#5a4a3a" stroke-width="0.9" opacity="0.28"/><text x="560" y="390" text-anchor="middle" font-size="12" fill="#5a4a3a">billet (chair-part length), end grain at left</text><path d="M378,310.0 C 470,306.0 520,314.0 600,309.0 S 690,312.0 722,310.0" fill="none" stroke="#a8442a" stroke-width="2.5"/><text x="560" y="292" text-anchor="middle" font-size="11.5" fill="#a8442a">split runs along the grain →</text><rect x="356" y="182" width="20" height="226" fill="#9aa0a6" stroke="#2b2118" stroke-width="1.8"/><line x1="352" y1="198" x2="150" y2="198" stroke="#8a6b4a" stroke-width="12" stroke-linecap="round"/><rect x="348" y="186" width="36" height="24" rx="5" fill="#7d7f84" stroke="#2b2118" stroke-width="1.8"/><text x="470" y="144" text-anchor="middle" font-size="13.5" fill="#2b2118">froe — blade across the end grain</text><line x1="400" y1="150" x2="368" y2="180" stroke="#5a4a3a" stroke-width="1"/><text x="250" y="176" text-anchor="middle" font-size="11" fill="#5a4a3a">handle parallel to the billet</text><path d="M168,120 Q 118,198 168,276" fill="none" stroke="#a8442a" stroke-width="2.2" stroke-dasharray="1,7" stroke-linecap="round" marker-start="url(#ahr)" marker-end="url(#ahr)"/><text x="140" y="306" text-anchor="middle" font-size="13" fill="#a8442a">lever up / down</text><text x="140" y="324" text-anchor="middle" font-size="11" fill="#5a4a3a">to open &amp; steer the split</text><rect x="302" y="276" width="34" height="68" rx="10" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><line x1="309" y1="338" x2="202" y2="414" stroke="#8a6b4a" stroke-width="9" stroke-linecap="round"/><line x1="352" y1="298" x2="343" y2="291" stroke="#2b2118" stroke-width="1.5"/><line x1="350" y1="310" x2="340" y2="310" stroke="#2b2118" stroke-width="1.5"/><line x1="352" y1="322" x2="343" y2="329" stroke="#2b2118" stroke-width="1.5"/><line x1="353" y1="287" x2="348" y2="278" stroke="#2b2118" stroke-width="1.5"/><text x="210" y="452" text-anchor="middle" font-size="13" fill="#2b2118">club seats the blade</text><text x="210" y="470" text-anchor="middle" font-size="11" fill="#5a4a3a">(smack the spine — drive the edge into the end grain)</text><line x1="708" y1="448" x2="823" y2="180" stroke="#8a6b4a" stroke-width="14" stroke-linecap="round"/><text x="765" y="470" text-anchor="middle" font-size="13" fill="#2b2118">riving brake</text><text x="765" y="487" text-anchor="middle" font-size="11" fill="#5a4a3a">(holds the billet; self-binds as you lever)</text><line x1="765" y1="458" x2="765" y2="368" stroke="#5a4a3a" stroke-width="1"/><text x="450.0" y="508" text-anchor="middle" font-size="15" fill="#2b2118" font-weight="bold">Riving = controlled splitting</text><text x="450.0" y="530" text-anchor="middle" font-size="13" fill="#5a4a3a">Keep equal mass on both sides and the split runs straight. If it wanders toward the thin side,</text><text x="450.0" y="548" text-anchor="middle" font-size="13" fill="#5a4a3a">lever the froe toward the thick side to pull it back. “Tic-tic-tic… and you’re back on track.”</text><text x="450.0" y="578" text-anchor="middle" font-size="11.5" fill="#5a4a3a" font-style="italic">An errant blow leaves an irreparable plane of weakness. Good, straight, long-fibered stock is a precious gift. (Alexander, MACFAT)</text></svg>