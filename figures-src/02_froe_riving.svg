<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="900" height="600" fill="#faf4e8"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker></defs><text x="450.0" y="40" text-anchor="middle" font-size="24" fill="#2b2118" font-weight="bold">Riving Chair Parts with a Froe</text><text x="450.0" y="64" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">Side view: seat the froe across the end of the bolt with the club, then lever the handle to open the split</text><line x1="830" y1="448" x2="715" y2="172" stroke="#6b4f33" stroke-width="14" stroke-linecap="round"/><rect x="250" y="250" width="540" height="90" rx="4" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><rect x="250" y="250" width="14" height="90" fill="#c39f6f" stroke="#5a4a3a" stroke-width="1"/><line x1="252" y1="260" x2="262" y2="260" stroke="#5a4a3a" stroke-width="0.7"/><line x1="252" y1="272" x2="262" y2="272" stroke="#5a4a3a" stroke-width="0.7"/><line x1="252" y1="284" x2="262" y2="284" stroke="#5a4a3a" stroke-width="0.7"/><line x1="252" y1="296" x2="262" y2="296" stroke="#5a4a3a" stroke-width="0.7"/><line x1="252" y1="308" x2="262" y2="308" stroke="#5a4a3a" stroke-width="0.7"/><line x1="252" y1="320" x2="262" y2="320" stroke="#5a4a3a" stroke-width="0.7"/><line x1="252" y1="332" x2="262" y2="332" stroke="#5a4a3a" stroke-width="0.7"/><text x="480.0" y="366" text-anchor="middle" font-size="12" fill="#5a4a3a">bolt (chair-part length), end grain at left</text><line x1="700" y1="448" x2="815" y2="172" stroke="#8a6b4a" stroke-width="14" stroke-linecap="round"/><text x="765" y="467" text-anchor="middle" font-size="13" fill="#2b2118">riving brake</text><text x="765" y="484" text-anchor="middle" font-size="11" fill="#5a4a3a">(holds the bolt; self-binds as you lever)</text><line x1="765" y1="455" x2="765" y2="348" stroke="#5a4a3a" stroke-width="1"/><path d="M340,287.8 C 400,282.8 460,290.8 560,286.8 S 620,288.8 640,287.8" fill="none" stroke="#a8442a" stroke-width="2.5"/><text x="420" y="273.8" font-size="11.5" fill="#a8442a">split opens along the grain →</text><rect x="140" y="281.8" width="195" height="12" fill="#9aa0a6" stroke="#2b2118" stroke-width="2"/><rect x="134" y="276.8" width="22" height="22" rx="4" fill="#7d7f84" stroke="#2b2118" stroke-width="1.8"/><line x1="149" y1="287.8" x2="108" y2="110" stroke="#8a6b4a" stroke-width="13" stroke-linecap="round"/><text x="126" y="94" font-size="14" fill="#2b2118">froe handle (lever)</text><text x="140" y="113" font-size="12" fill="#a8442a">lever to pry &amp; steer</text><path d="M132,152 Q186,168 176,220" fill="none" stroke="#a8442a" stroke-width="2" marker-end="url(#ahr)"/><text x="28" y="330" font-size="11" fill="#5a4a3a">froe blade in the kerf</text><line x1="108" y1="325" x2="175" y2="295.8" stroke="#5a4a3a" stroke-width="1"/><rect x="202" y="218" width="32" height="58" rx="8" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><line x1="218" y1="224" x2="258" y2="150" stroke="#8a6b4a" stroke-width="9" stroke-linecap="round"/><line x1="204" y1="277.8" x2="192" y2="268.8" stroke="#2b2118" stroke-width="1.5"/><line x1="232" y1="277.8" x2="244" y2="268.8" stroke="#2b2118" stroke-width="1.5"/><line x1="206" y1="271.8" x2="198" y2="259.8" stroke="#2b2118" stroke-width="1.5"/><line x1="230" y1="271.8" x2="238" y2="259.8" stroke="#2b2118" stroke-width="1.5"/><text x="272" y="162" font-size="13" fill="#2b2118">club seats the blade</text><text x="272" y="180" font-size="11" fill="#5a4a3a">(strike the exposed spine)</text><text x="450.0" y="508" text-anchor="middle" font-size="15" fill="#2b2118" font-weight="bold">Riving = controlled splitting</text><text x="450.0" y="530" text-anchor="middle" font-size="13" fill="#5a4a3a">Keep equal mass on both sides and the split runs straight. If it wanders toward the thin side,</text><text x="450.0" y="548" text-anchor="middle" font-size="13" fill="#5a4a3a">lever the froe toward the thick side to pull it back. “Tic-tic-tic… and you’re back on track.”</text><text x="450.0" y="578" text-anchor="middle" font-size="11.5" fill="#5a4a3a" font-style="italic">An errant blow leaves an irreparable plane of weakness. Good, straight, long-fibered stock is a precious gift. (Alexander, MACFAT)</text></svg>