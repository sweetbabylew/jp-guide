<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="760" height="780" fill="#faf4e8"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a4a3a"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker></defs><text x="380.0" y="40" text-anchor="middle" font-size="23" fill="#2b2118" font-weight="bold">Anatomy of a Jimmy Possum Chair</text><text x="380.0" y="64" text-anchor="middle" font-size="12.5" fill="#5a4a3a" font-style="italic">A slight three-quarter view. The legs rake front-to-back only &#8212; from the front they stand plumb; nothing splays sideways.</text><polygon points="267.0,505.9 249.8,505.9 236.1,373.1 250.0,371.5" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="224.6,529.7 207.6,529.7 212.0,382.1 226.0,382.4" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="456.0,505.9 438.8,505.9 425.1,373.1 439.0,371.5" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="413.6,529.7 396.6,529.7 401.0,382.1 415.0,382.4" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><path d="M245.0 181.8 L461.0 181.8 L461.0 162.9 Q 353.0 149.4 245.0 162.9 Z" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><polygon points="202.0,377.0 418.0,377.0 456.4,355.4 240.4,355.4" fill="#ead8b8" stroke="#2b2118" stroke-width="2.5"/><polygon points="418.0,377.0 456.4,355.4 456.4,368.9 418.0,390.5" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><polygon points="202.0,377.0 418.0,377.0 418.0,390.5 202.0,390.5" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><polygon points="302.0,359.5 293.0,359.1 302.0,179.0 309.5,179.3" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="349.2,359.5 340.2,359.1 349.2,179.0 356.7,179.3" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="396.5,359.5 387.5,359.1 396.5,179.0 404.0,179.3" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="227.9,290.8 205.4,290.8 245.8,268.1 268.3,268.1" fill="#ead8b8" stroke="#2b2118" stroke-width="2.5"/><polygon points="227.9,290.8 205.4,290.8 205.4,299.8 227.9,299.8" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><polygon points="394.4,290.8 416.9,290.8 457.3,268.1 434.8,268.1" fill="#ead8b8" stroke="#2b2118" stroke-width="2.5"/><polygon points="416.9,290.8 457.3,268.1 457.3,277.1 416.9,299.8" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><polygon points="394.4,290.8 416.9,290.8 416.9,299.8 394.4,299.8" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><polygon points="255.0,359.5 245.5,359.1 254.5,178.9 262.5,179.3" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="444.0,359.5 434.5,359.1 443.5,178.9 451.5,179.3" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="248.6,363.1 235.6,364.6 225.6,268.1 236.5,266.8" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="225.6,376.9 212.6,376.7 215.6,272.9 226.6,273.2" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="437.6,363.1 424.6,364.6 414.6,268.1 425.5,266.8" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="414.6,376.9 401.6,376.7 404.6,272.9 415.6,273.2" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><line x1="216.7" y1="376.3" x2="252.2" y2="356.3" stroke="#a8442a" stroke-width="1.7" stroke-dasharray="4,3.5"/><line x1="405.7" y1="376.3" x2="441.2" y2="356.3" stroke="#a8442a" stroke-width="1.7" stroke-dasharray="4,3.5"/><polygon points="217.1,273.1 225.1,273.1 222.7,283.1 219.5,283.1" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><polygon points="227.0,267.5 235.0,267.5 232.6,277.5 229.4,277.5" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><polygon points="250.8,253.5 258.8,253.5 256.4,263.5 253.2,263.5" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><polygon points="406.1,273.1 414.1,273.1 411.7,283.1 408.5,283.1" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><polygon points="416.0,267.5 424.0,267.5 421.6,277.5 418.4,277.5" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><polygon points="439.8,253.5 447.8,253.5 445.4,263.5 442.2,263.5" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><line x1="209" y1="161" x2="242" y2="166" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="209" y="157" font-size="13" fill="#2b2118" text-anchor="end">crest (comb)</text><line x1="502" y1="226" x2="450" y2="235" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="502" y="222" font-size="13" fill="#2b2118" text-anchor="start">back sticks &#8212; about 1 in</text><line x1="502" y1="266" x2="461" y2="271" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="502" y="262" font-size="13" fill="#2b2118" text-anchor="start">arm &#8212; a board about 2&#189; in wide</text><line x1="172" y1="259" x2="216" y2="270" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="172" y="255" font-size="13" fill="#2b2118" text-anchor="end">legs wedged proud</text><line x1="502" y1="352" x2="460" y2="356" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="502" y="348" font-size="13" fill="#2b2118" text-anchor="start">slab seat &#8212; 24 &#215; 16 &#215; 1&#189; in</text><text x="380.0" y="556" text-anchor="middle" font-size="12" fill="#a8442a" font-style="italic">front leg, back leg and outer back stick all rise from one side layout line (dashed) &#8212; 1&#189; in inside each seat edge</text><rect x="130" y="584" width="250" height="118" rx="10" fill="none" stroke="#a8442a" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="162" y1="584" x2="211" y2="391" stroke="#a8442a" stroke-width="1.2" marker-end="url(#ahr)"/><text x="142" y="606" font-size="13" fill="#a8442a" font-weight="bold">The signature joint:</text><text x="142" y="626" font-size="12" fill="#5a4a3a">legs pass through the seat and</text><text x="142" y="644" font-size="12" fill="#5a4a3a">continue up into the arms,</text><text x="142" y="662" font-size="12" fill="#5a4a3a">locked with wooden wedges.</text><text x="142" y="684" font-size="11" fill="#5a4a3a" font-style="italic">No screws &#8212; wood locking wood.</text><text x="380.0" y="766" text-anchor="middle" font-size="11.5" fill="#5a4a3a" font-style="italic">A folk chair: parts riven from green wood, shaved by hand, and locked with wedged through-tenons.</text></svg>