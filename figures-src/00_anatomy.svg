<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="760" height="820" fill="#faf4e8"/><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5a4a3a"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker></defs><text x="380.0" y="40" text-anchor="middle" font-size="23" fill="#2b2118" font-weight="bold">Anatomy of a Jimmy Possum Chair</text><ellipse cx="330" cy="470" rx="135" ry="30" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><rect x="195" y="470" width="270" height="34" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><ellipse cx="330" cy="504" rx="135" ry="30" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><line x1="550" y1="540" x2="450" y2="504" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="550" y="552" font-size="13" fill="#2b2118" text-anchor="start">slab seat</text><line x1="180" y1="720" x2="230" y2="500" stroke="#c39f6f" stroke-width="13" stroke-linecap="round"/><line x1="230" y1="480" x2="235" y2="306" stroke="#d9b98a" stroke-width="11" stroke-linecap="round"/><line x1="230" y1="480" x2="235" y2="306" stroke="#2b2118" stroke-width="1.2" fill="none" opacity="0.4"/><polygon points="229,284 241,284 237,306 233,306" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><line x1="480" y1="720" x2="430" y2="500" stroke="#c39f6f" stroke-width="13" stroke-linecap="round"/><line x1="430" y1="480" x2="425" y2="306" stroke="#d9b98a" stroke-width="11" stroke-linecap="round"/><line x1="430" y1="480" x2="425" y2="306" stroke="#2b2118" stroke-width="1.2" fill="none" opacity="0.4"/><polygon points="419,284 431,284 427,306 423,306" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><rect x="180" y="288" width="110" height="22" rx="8" fill="#ead8b8" stroke="#2b2118" stroke-width="2.5"/><rect x="370" y="288" width="110" height="22" rx="8" fill="#ead8b8" stroke="#2b2118" stroke-width="2.5"/><line x1="562" y1="270" x2="480" y2="300" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="562" y="266" font-size="13" fill="#2b2118" text-anchor="start">arm</text><line x1="562" y1="306" x2="425" y2="286" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="562" y="318" font-size="13" fill="#2b2118" text-anchor="start">leg wedged proud</text><line x1="260" y1="476" x2="273" y2="138" stroke="#d9b98a" stroke-width="8" stroke-linecap="round"/><line x1="300" y1="476" x2="305" y2="138" stroke="#d9b98a" stroke-width="8" stroke-linecap="round"/><line x1="340" y1="476" x2="338" y2="138" stroke="#d9b98a" stroke-width="8" stroke-linecap="round"/><line x1="380" y1="476" x2="371" y2="138" stroke="#d9b98a" stroke-width="8" stroke-linecap="round"/><line x1="562" y1="240" x2="380" y2="210" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="562" y="252" font-size="13" fill="#2b2118" text-anchor="start">back sticks</text><path d="M235 142 Q 330 114 425 138 L 425 154 Q 330 130 235 158 Z" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><line x1="180" y1="114" x2="330" y2="126" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="180" y="110" font-size="13" fill="#2b2118" text-anchor="end">crest (comb)</text><rect x="212" y="648" width="240" height="120" rx="10" fill="none" stroke="#a8442a" stroke-width="1.5" stroke-dasharray="4,4"/><line x1="296" y1="648" x2="233" y2="510" stroke="#a8442a" stroke-width="1.2" marker-end="url(#ahr)"/><text x="224" y="670" font-size="13" fill="#a8442a" font-weight="bold">The signature joint:</text><text x="224" y="690" font-size="12" fill="#5a4a3a">legs pass through the seat and</text><text x="224" y="708" font-size="12" fill="#5a4a3a">continue up into the arms,</text><text x="224" y="726" font-size="12" fill="#5a4a3a">locked with wooden wedges.</text><text x="224" y="748" font-size="11" fill="#5a4a3a" font-style="italic">No screws, no glue required.</text><text x="380.0" y="806" text-anchor="middle" font-size="11.5" fill="#5a4a3a" font-style="italic">A folk chair: every part split green from one log, shaved by hand, and joined with tapered, wedged round tenons.</text></svg>