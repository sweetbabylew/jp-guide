91.9" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="262.8" y1="397.6" x2="176.2" y2="273.9" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="264.2" y1="396.8" x2="200.4" y2="260.0" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="265.7" y1="396.3" x2="226.6" y2="250.5" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="267.2" y1="396.0" x2="254.1" y2="245.6" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="268.8" y1="396.0" x2="281.9" y2="245.6" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="270.3" y1="396.3" x2="309.4" y2="250.5" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="271.8" y1="396.8" x2="335.6" y2="260.0" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="273.2" y1="397.6" x2="359.8" y2="273.9" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="274.4" y1="398.6" x2="381.1" y2="291.9" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="275.4" y1="399.8" x2="399.1" y2="313.2" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="276.2" y1="401.2" x2="413.0" y2="337.4" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="276.7" y1="402.7" x2="422.5" y2="363.6" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><line x1="277.0" y1="404.2" x2="427.4" y2="391.1" stroke="#8a5a2b" stroke-width="0.8" opacity="0.45"/><circle cx="268" cy="405" r="5" fill="#2b2118"/><line x1="268.0" y1="405.0" x2="131.2" y2="484.0" stroke="#a8442a" stroke-width="3" marker-end="url(#ahr)"/><text x="196" y="428" text-anchor="middle" font-size="14" fill="#a8442a" font-weight="bold">RADIAL</text><text x="196" y="442" text-anchor="middle" font-size="10.5" fill="#a8442a" font-style="italic">pith &#8594; bark, along a ray</text><line x1="287.2" y1="279.8" x2="366.8" y2="325.8" stroke="#5b6e4f" stroke-width="3" marker-start="url(#ahs)" marker-end="url(#ahs)"/><text x="293" y="264" font-size="14" fill="#5b6e4f" font-weight="bold">TANGENTIAL</text><text x="293" y="278" font-size="10.5" fill="#5b6e4f" font-style="italic">along the ring</text><text x="70" y="592" font-size="13.5" fill="#2b2118" font-weight="bold">pith</text><text x="70" y="608" font-size="11" fill="#5a4a3a">the soft center</text><line x1="105" y1="585" x2="263" y2="410" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="268" y="640" text-anchor="middle" font-size="13.5" fill="#2b2118" font-weight="bold">growth rings</text><line x1="268" y1="628" x2="268" y2="525" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="60" y="196" font-size="13.5" fill="#8a5a2b" font-weight="bold">medullary rays</text><text x="60" y="212" font-size="11" fill="#5a4a3a">radiate like spokes;</text><text x="60" y="226" font-size="11" fill="#5a4a3a">splits love to follow them</text><line x1="150" y1="214" x2="185.25887087129422" y2="340.3555450908059" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="468" y="352" font-size="13.5" fill="#2b2118" font-weight="bold">sapwood</text><text x="468" y="368" font-size="11" fill="#5a4a3a">pale outer band,</text><text x="468" y="382" font-size="11" fill="#5a4a3a">still living when cut</text><line x1="460" y1="356" x2="432.3844994111007" y2="428.10273475937083" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="468" y="470" font-size="13.5" fill="#2b2118" font-weight="bold">heartwood</text><text x="468" y="486" font-size="11" fill="#5a4a3a">the dark, strong,</text><text x="468" y="500" font-size="11" fill="#5a4a3a">rot-resistant core</text><line x1="460" y1="476" x2="337.2820323027551" y2="445.0" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><line x1="301.5" y1="312.9" x2="620" y2="298" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,3"/><rect x="590" y="128" width="300" height="176" rx="8" fill="#f4ead2" stroke="#5a4a3a" stroke-width="1.6"/><text x="740.0" y="118" text-anchor="middle" font-size="13.5" fill="#2b2118" font-weight="bold">One growth ring, magnified</text><rect x="606" y="154" width="268" height="32" fill="#ead8b8" stroke="#c39f6f" stroke-width="0.8"/><circle cx="622" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="646" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="670" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="694" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="718" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="742" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="766" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="790" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="814" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="838" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="862" cy="170" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><rect x="606" y="186" width="268" height="9" fill="#c39f6f"/><line x1="606" y1="190" x2="874" y2="190" stroke="#2b2118" stroke-width="1.6"/><rect x="606" y="202" width="268" height="32" fill="#ead8b8" stroke="#c39f6f" stroke-width="0.8"/><circle cx="622" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="646" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="670" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="694" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="718" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="742" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="766" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="790" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="814" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="838" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="862" cy="218" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><rect x="606" y="234" width="268" height="9" fill="#c39f6f"/><line x1="606" y1="238" x2="874" y2="238" stroke="#2b2118" stroke-width="1.6"/><rect x="606" y="250" width="268" height="32" fill="#ead8b8" stroke="#c39f6f" stroke-width="0.8"/><circle cx="622" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="646" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="670" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="694" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="718" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="742" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="766" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="790" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="814" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="838" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><circle cx="862" cy="266" r="4.6" fill="none" stroke="#8a5a2b" stroke-width="1.2"/><rect x="606" y="282" width="268" height="9" fill="#c39f6f"/><line x1="606" y1="286" x2="874" y2="286" stroke="#2b2118" stroke-width="1.6"/><text x="906" y="156" font-size="12.5" fill="#8a5a2b" font-weight="bold">porous earlywood</text><text x="906" y="172" font-size="10.5" fill="#5a4a3a">open pores &#8212; laid</text><text x="906" y="185" font-size="10.5" fill="#5a4a3a">down fast &amp; soft</text><line x1="902" y1="152" x2="862" y2="170" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="906" y="276" font-size="12.5" fill="#2b2118" font-weight="bold">dense latewood</text><text x="906" y="292" font-size="10.5" fill="#5a4a3a">the strong stuff &#8212;</text><text x="906" y="305" font-size="10.5" fill="#5a4a3a">grown slow &amp; hard</text><line x1="902" y1="272" x2="862" y2="286" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ah)"/><text x="895" y="360" text-anchor="middle" font-size="17" fill="#a8442a" font-weight="bold">When it dries, it moves &#8212; unevenly</text><text x="895" y="382" text-anchor="middle" font-size="12.5" fill="#5a4a3a" font-style="italic">tangential (along the ring) shrinks about <tspan fill="#a8442a" font-weight="bold">2&#215;</tspan> as much as radial (along a ray)</text><rect x="640" y="430" width="92" height="92" fill="none" stroke="#5a4a3a" stroke-width="1.6" stroke-dasharray="5,4"/><path d="M642 448.4 Q 686.0 439.4 730 448.4" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.7"/><path d="M642 466.8 Q 686.0 457.8 730 466.8" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.7"/><path d="M642 485.2 Q 686.0 476.2 730 485.2" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.7"/><path d="M642 503.6 Q 686.0 494.6 730 503.6" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.7"/><text x="686.0" y="418" text-anchor="middle" font-size="12.5" fill="#2b2118" font-weight="bold">green: square</text><line x1="748" y1="476.0" x2="792" y2="476.0" stroke="#2b2118" stroke-width="2.4" marker-end="url(#ahk)"/><text x="770" y="466.0" text-anchor="middle" font-size="10.5" fill="#5a4a3a" font-style="italic">dries</text><rect x="810" y="447.48" width="82.8" height="57.04" fill="#d9b98a" stroke="#2b2118" stroke-width="2.4"/><path d="M812 458.9 Q 851.4 451.9 890.8 458.9" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.8"/><path d="M812 470.3 Q 851.4 463.3 890.8 470.3" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.8"/><path d="M812 481.7 Q 851.4 474.7 890.8 481.7" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.8"/><path d="M812 493.1 Q 851.4 486.1 890.8 493.1" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.8"/><text x="851" y="418" text-anchor="middle" font-size="12.5" fill="#a8442a" font-weight="bold">dry: oblong</text><line x1="908.8" y1="450.48" x2="908.8" y2="501.52000000000004" stroke="#a8442a" stroke-width="2" marker-start="url(#ahr)" marker-end="url(#ahr)"/><text x="916.8" y="473" font-size="10.5" fill="#a8442a" font-weight="bold">tangential</text><text x="916.8" y="486" font-size="10.5" fill="#a8442a">shrinks most</text><line x1="813" y1="520.52" x2="889.8" y2="520.52" stroke="#5b6e4f" stroke-width="2" marker-start="url(#ahs)" marker-end="url(#ahs)"/><text x="851" y="535" text-anchor="middle" font-size="10.5" fill="#5b6e4f" font-weight="bold">radial: barely half</text><circle cx="720" cy="640" r="78" fill="#d9b98a" stroke="#2b2118" stroke-width="2.6"/><circle cx="720" cy="640" r="70" fill="none" stroke="#c39f6f" stroke-width="1"/><circle cx="720" cy="640" r="20" fill="none" stroke="#c39f6f" stroke-width="1.3" opacity="0.85"/><circle cx="720" cy="640" r="40" fill="none" stroke="#c39f6f" stroke-width="1.3" opacity="0.85"/><circle cx="720" cy="640" r="58" fill="none" stroke="#c39f6f" stroke-width="1.3" opacity="0.85"/><circle cx="720" cy="640" r="3.5" fill="#2b2118"/><path d="M725.8 630.7 L752.7 571.4 A 76 76 0 0 1 767.3 580.5 Z" fill="#faf4e8" stroke="#a8442a" stroke-width="2.4"/><text x="628" y="582" text-anchor="end" font-size="12.5" fill="#a8442a" font-weight="bold">the check opens</text><text x="628" y="598" text-anchor="end" font-size="12.5" fill="#a8442a" font-weight="bold">along a ray</text><text x="628" y="614" text-anchor="end" font-size="10.5" fill="#5a4a3a" font-style="italic">(the radial plane)</text><line x1="632" y1="588" x2="752.9" y2="587.4" stroke="#5a4a3a" stroke-width="1" marker-end="url(#ahr)"/><text x="814" y="622" font-size="11" fill="#5a4a3a" font-style="italic">rings pull apart</text><text x="814" y="636" font-size="11" fill="#5a4a3a" font-style="italic">the long way</text><text x="814" y="650" font-size="11" fill="#5a4a3a" font-style="italic">(around), so the</text><text x="814" y="664" font-size="11" fill="#5a4a3a" font-style="italic">wood splits out</text><text x="814" y="678" font-size="11" fill="#5a4a3a" font-style="italic">toward the bark.</text><rect x="300" y="720" width="600" height="46" rx="10" fill="none" stroke="#a8442a" stroke-width="1.5" stroke-dasharray="5,4"/><text x="318" y="741" font-size="13" fill="#a8442a" font-weight="bold">On the chair:</text><text x="412" y="741" font-size="12" fill="#5a4a3a">a <tspan font-style="italic">drier</tspan> tenon set into a <tspan font-style="italic">wetter</tspan> mortise locks tight as the mortise</text><text x="318" y="758" font-size="12" fill="#5a4a3a">shrinks around it &#8212; the same wood movement that cracks a log is what makes the joint.</text><text x="600.0" y="792" text-anchor="middle" font-size="11.5" fill="#5a4a3a" font-style="italic">After Peter Galbert, &#8220;Chairmaker&#8217;s Notebook,&#8221; Fig. 1.1 &amp; 1.12.</text></svg>