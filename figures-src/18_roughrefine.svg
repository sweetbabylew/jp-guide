<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 584" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="980" height="584" fill="#faf4e8"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker><marker id="ahr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker></defs><text x="490.0" y="40" text-anchor="middle" font-size="25" fill="#2b2118" font-weight="bold">Roughing &amp; Refining</text><text x="490.0" y="66" text-anchor="middle" font-size="14" fill="#5a4a3a" font-style="italic">One knife, held bevel-down throughout — the difference is how it meets the fibers</text><rect x="85" y="300" width="330" height="48" rx="3" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="415,300 439,287 439,335 415,348" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><polygon points="85,300 109,287 439,287 415,300" fill="#ead8b8" stroke="#2b2118" stroke-width="1.6"/><path d="M91 320.0 Q 250.0 311.0 409 300.0" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.75"/><path d="M91 326.4 Q 250.0 317.4 409 306.4" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.75"/><path d="M91 332.8 Q 250.0 323.8 409 312.8" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.75"/><path d="M91 339.2 Q 250.0 330.2 409 319.2" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.75"/><path d="M91 345.6 Q 250.0 336.6 409 325.6" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.75"/><path d="M91 352.0 Q 250.0 343.0 409 332.0" fill="none" stroke="#c39f6f" stroke-width="1.1" opacity="0.75"/><path d="M254 306 L 409 306 L 409 315 L 254 315 Z" fill="#ead8b8" stroke="none" opacity="0.9"/><line x1="254" y1="315" x2="409" y2="315" stroke="#5a4a3a" stroke-width="1" opacity="0.6"/><polyline points="99.0,315.0 109.8,313.9 120.6,312.8 131.4,316.0 142.1,312.3 152.9,315.2 163.7,314.1 174.5,312.2 185.3,315.0 196.1,312.0 206.9,314.6 217.6,312.2 228.4,312.4 239.2,314.5 250.0,315.0" fill="none" stroke="#a8442a" stroke-width="1.4" opacity="0.85"/><path d="M254 306 q -30 -30 -60 -20 q 22 -22 48 -8 q -6 8 12 28 Z" fill="#ead8b8" stroke="#2b2118" stroke-width="1.6"/><path d="M248 302 q -20 -16 -40 -12" fill="none" stroke="#c39f6f" stroke-width="0.8" opacity="0.7"/><path d="M239 302 q -20 -16 -40 -12" fill="none" stroke="#c39f6f" stroke-width="0.8" opacity="0.7"/><polygon points="249.4,315.8 161.1,283.7 166.5,268.6 254.9,300.8" fill="#9aa0a6" stroke="#2b2118" stroke-width="1.6"/><polygon points="254.0,309.0 230.9,308.1 236.1,294.0" fill="#7c8288" stroke="#2b2118" stroke-width="1.2"/><line x1="163.8" y1="276.2" x2="121.6" y2="292.7" stroke="#8a6b4a" stroke-width="9.0" stroke-linecap="round"/><line x1="163.8" y1="276.2" x2="124.1" y2="268.1" stroke="#6b4f33" stroke-width="11.0" stroke-linecap="round"/><circle cx="124.1" cy="268.1" r="6.0" fill="#6b4f33" stroke="#2b2118" stroke-width="1"/><circle cx="121.6" cy="292.7" r="5.0" fill="#8a6b4a" stroke="#2b2118" stroke-width="1"/><line x1="328" y1="260" x2="170" y2="260" stroke="#a8442a" stroke-width="3" marker-end="url(#ahr)"/><text x="250" y="252" text-anchor="middle" font-size="12.5" fill="#a8442a" font-weight="bold">pull — into the hillside</text><text x="250" y="118" text-anchor="middle" font-size="19" fill="#2b2118" font-weight="bold">Roughing</text><text x="250" y="140" text-anchor="middle" font-size="12.5" fill="#5a4a3a" font-style="italic">fast shaping — a little torn is fine</text><text x="79" y="388" font-size="12.5" fill="#2b2118" font-weight="bold">into the hillside —</text><text x="79" y="405" font-size="12.5" fill="#2b2118">peel to an even fiber level</text><text x="79" y="428" font-size="11" fill="#5a4a3a">the knife bites into the rising fibers</text><line x1="169.5" y1="315" x2="169.5" y2="366" stroke="#a8442a" stroke-width="1" stroke-dasharray="2,3"/><text x="169.5" y="448" text-anchor="middle" font-size="10.5" fill="#a8442a">the torn fibers left where the knife lifts out</text><text x="169.5" y="462" text-anchor="middle" font-size="10.5" fill="#a8442a">mark the level for the next pass</text><line x1="490.0" y1="150" x2="490.0" y2="500" stroke="#c39f6f" stroke-width="1.2" stroke-dasharray="4,5" opacity="0.7"/><rect x="565" y="300" width="330" height="48" rx="3" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="895,300 919,287 919,335 895,348" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><polygon points="565,300 589,287 919,287 895,300" fill="#ead8b8" stroke="#2b2118" stroke-width="1.6"/><path d="M571 310.0 Q 730.0 308.0 889 310.0" fill="none" stroke="#c39f6f" stroke-width="1.0" opacity="0.7"/><path d="M571 316.2 Q 730.0 314.2 889 316.2" fill="none" stroke="#c39f6f" stroke-width="1.0" opacity="0.7"/><path d="M571 322.4 Q 730.0 320.4 889 322.4" fill="none" stroke="#c39f6f" stroke-width="1.0" opacity="0.7"/><path d="M571 328.6 Q 730.0 326.6 889 328.6" fill="none" stroke="#c39f6f" stroke-width="1.0" opacity="0.7"/><path d="M571 334.8 Q 730.0 332.8 889 334.8" fill="none" stroke="#c39f6f" stroke-width="1.0" opacity="0.7"/><path d="M571 341.0 Q 730.0 339.0 889 341.0" fill="none" stroke="#c39f6f" stroke-width="1.0" opacity="0.7"/><line x1="571" y1="306" x2="889" y2="306" stroke="#faf4e8" stroke-width="2.5"/><line x1="571" y1="307.5" x2="889" y2="307.5" stroke="#5a4a3a" stroke-width="0.7" opacity="0.5"/><path d="M734 305 q -28 -14 -56 -22 q 20 -4 40 6 q -4 6 16 16 Z" fill="#faf4e8" stroke="#5a4a3a" stroke-width="1.1"/><path d="M728 303 q -22 -10 -44 -16" fill="none" stroke="#5a4a3a" stroke-width="0.7" opacity="0.7"/><polygon points="730.9,312.6 637.8,299.6 640.0,283.7 733.1,296.8" fill="#9aa0a6" stroke="#2b2118" stroke-width="1.6"/><polygon points="734.0,305.0 711.2,308.9 713.3,294.0" fill="#7c8288" stroke="#2b2118" stroke-width="1.2"/><line x1="638.9" y1="291.6" x2="601.1" y2="316.6" stroke="#8a6b4a" stroke-width="9.0" stroke-linecap="round"/><line x1="638.9" y1="291.6" x2="598.5" y2="292.0" stroke="#6b4f33" stroke-width="11.0" stroke-linecap="round"/><circle cx="598.5" cy="292.0" r="6.0" fill="#6b4f33" stroke="#2b2118" stroke-width="1"/><circle cx="601.1" cy="316.6" r="5.0" fill="#8a6b4a" stroke="#2b2118" stroke-width="1"/><line x1="808" y1="260" x2="650" y2="260" stroke="#a8442a" stroke-width="3" marker-end="url(#ahr)"/><text x="730" y="252" text-anchor="middle" font-size="12.5" fill="#a8442a" font-weight="bold">pull — with the grain</text><text x="730" y="118" text-anchor="middle" font-size="19" fill="#2b2118" font-weight="bold">Refining</text><text x="730" y="140" text-anchor="middle" font-size="12.5" fill="#5a4a3a" font-style="italic">light finishing &amp; fitting — leaves it smooth</text><text x="559" y="388" font-size="12.5" fill="#2b2118" font-weight="bold">with the grain —</text><text x="559" y="405" font-size="12.5" fill="#2b2118">refine the shape, smooth</text><text x="559" y="428" font-size="11" fill="#5a4a3a">the knife rides over the fibers the way they lie —</text><text x="559" y="443" font-size="11" fill="#5a4a3a">a thin, wispy shaving, a glassy surface</text><text x="490.0" y="560" text-anchor="middle" font-size="12.5" fill="#5a4a3a" font-style="italic">Rough into the hillside to an even level; refine with the grain to a finish. The knife stays bevel-down — blade in line with the handles — throughout.</text><text x="490.0" y="582" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">After Peter Galbert, “Chairmaker’s Notebook,” Ch. 10.</text></svg>