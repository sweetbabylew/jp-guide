<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="900" height="540" fill="#faf4e8"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker></defs><text x="450.0" y="38" text-anchor="middle" font-size="24" fill="#2b2118" font-weight="bold">Extras · Saddling (Carving) the Seat</text><text x="450.0" y="64" text-anchor="middle" font-size="13.5" fill="#5a4a3a" font-style="italic">Optional on a Jimmy Possum — hollow the seat for comfort</text><rect x="80" y="110" width="330" height="250" rx="20" fill="#ead8b8" stroke="#2b2118" stroke-width="2.5"/><text x="245.0" y="100" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">Plan — contour lines of the hollow</text><ellipse cx="245.0" cy="247.5" rx="95" ry="66.5" fill="none" stroke="#8a5a2b" stroke-width="1.4" opacity="0.8"/><ellipse cx="245.0" cy="257.5" rx="72" ry="50.4" fill="none" stroke="#8a5a2b" stroke-width="1.4" opacity="0.68"/><ellipse cx="245.0" cy="267.5" rx="48" ry="33.599999999999994" fill="none" stroke="#8a5a2b" stroke-width="1.4" opacity="0.56"/><ellipse cx="245.0" cy="277.5" rx="26" ry="18.2" fill="none" stroke="#8a5a2b" stroke-width="1.4" opacity="0.44000000000000006"/><circle cx="245.0" cy="277.5" r="3.5" fill="#a8442a"/><line x1="300.0" y1="322.5" x2="251.0" y2="282.5" stroke="#a8442a" stroke-width="1"/><text x="323.0" y="332.5" text-anchor="middle" font-size="10.5" fill="#a8442a">deepest point — aft of center</text><line x1="245.0" y1="140" x2="245.0" y2="340" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,4"/><text x="245.0" y="354" text-anchor="middle" font-size="10.5" fill="#5a4a3a">centerline</text><text x="245.0" y="134" text-anchor="middle" font-size="10.5" fill="#5a4a3a">front edge</text><rect x="470" y="150" width="350" height="56" fill="none" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="4,4"/><path d="M470 150 L 500 150 Q 645.0 208 790 150 L 820 150 L 820 206 L 470 206 Z" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><text x="645.0" y="236" text-anchor="middle" font-size="12" fill="#5a4a3a">seat in section — the scooped “saddle”</text><rect x="470" y="300" width="345" height="46" rx="8" fill="#faf4e8" stroke="#5a4a3a" stroke-width="1.5"/><line x1="486" y1="337" x2="518" y2="315" stroke="#c39f6f" stroke-width="5" stroke-linecap="round"/><path d="M512 309 Q 530 311 526 335 L 521 333 Q 522 319 510 317 Z" fill="#8a8f94" stroke="#2b2118" stroke-width="1.2"/><text x="544" y="320" font-size="13" fill="#2b2118" font-weight="bold">1 · Adze / gouge</text><text x="544" y="337" font-size="11" fill="#5a4a3a">hog out the bulk fast</text><rect x="470" y="352" width="345" height="46" rx="8" fill="#faf4e8" stroke="#5a4a3a" stroke-width="1.5"/><path d="M492 369 A 14 14 0 0 0 520 369" fill="none" stroke="#8a8f94" stroke-width="4"/><line x1="492" y1="369" x2="483" y2="360" stroke="#c39f6f" stroke-width="5" stroke-linecap="round"/><line x1="520" y1="369" x2="529" y2="360" stroke="#c39f6f" stroke-width="5" stroke-linecap="round"/><text x="544" y="372" font-size="13" fill="#2b2118" font-weight="bold">2 · Inshave / scorp</text><text x="544" y="389" font-size="11" fill="#5a4a3a">refine the hollow</text><rect x="470" y="404" width="345" height="46" rx="8" fill="#faf4e8" stroke="#5a4a3a" stroke-width="1.5"/><path d="M482 431 Q 506 411 530 431 Q 506 425 482 431 Z" fill="#c39f6f" stroke="#2b2118" stroke-width="1.2"/><path d="M495 430 Q 506 438 517 430" fill="none" stroke="#8a8f94" stroke-width="3"/><text x="544" y="424" font-size="13" fill="#2b2118" font-weight="bold">3 · Travisher</text><text x="544" y="441" font-size="11" fill="#5a4a3a">smooth the surface</text><rect x="470" y="456" width="345" height="46" rx="8" fill="#faf4e8" stroke="#5a4a3a" stroke-width="1.5"/><path d="M491 470 Q 506 465 521 470 L 521 490 Q 506 485 491 490 Z" fill="#8a8f94" stroke="#2b2118" stroke-width="1.2"/><text x="544" y="476" font-size="13" fill="#2b2118" font-weight="bold">4 · Scraper</text><text x="544" y="493" font-size="11" fill="#5a4a3a">final clean-up</text><text x="642" y="292" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">Coarse → fine</text><text x="245.0" y="394" text-anchor="middle" font-size="12" fill="#5a4a3a">Carve across the grain to hog out, then with it to smooth.</text><text x="245.0" y="412" text-anchor="middle" font-size="12" fill="#5a4a3a">Keep the deepest point under the sitter — about a thumb&#39;s depth.</text><text x="450.0" y="528" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">Historically JP chairs were left flat; saddling is your option. Work green wood with a dry seat blank to avoid splits.</text></svg>