<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="920" height="760" fill="#faf4e8"/><text x="460.0" y="36" text-anchor="middle" font-size="23" fill="#2b2118" font-weight="bold">The Jimmy Possum Joint (side view)</text><text x="460.0" y="60" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">Front leg through the arm&#39;s front; the outer back stick through the arm&#39;s rear and up to the crest. Legs rake, no splay.</text><line x1="250" y1="620" x2="790" y2="620" stroke="#2b2118" stroke-width="2"/><line x1="262" y1="620" x2="253" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="302" y1="620" x2="293" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="342" y1="620" x2="333" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="382" y1="620" x2="373" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="422" y1="620" x2="413" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="462" y1="620" x2="453" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="502" y1="620" x2="493" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="542" y1="620" x2="533" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="582" y1="620" x2="573" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="622" y1="620" x2="613" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="662" y1="620" x2="653" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="702" y1="620" x2="693" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="742" y1="620" x2="733" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="782" y1="620" x2="773" y2="629" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><polygon points="330,416 522,430 522,448 330,434" fill="#ead8b8" stroke="#2b2118" stroke-width="2.5"/><polygon points="339.5,316.0 541.5,327.8 542.5,309.8 340.5,298.0" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><polygon points="346.0,621.0 320.0,619.0 351.5,282.5 364.4,283.4" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="568.5,614.3 545.1,625.7 387.5,288.9 400.1,282.8" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="502.7,461.0 576.3,142.3 564.6,139.7 491.0,458.3" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><polygon points="529.3,158.9 613.3,144.9 610.7,129.1 526.7,143.1" fill="#c39f6f" stroke="#2b2118" stroke-width="2.2"/><polygon points="351.9,281.9 363.9,281.9 360.4,295.9 355.4,295.9" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><polygon points="387.8,284.9 399.8,284.9 396.3,298.9 391.3,298.9" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><polygon points="528.9,295 540.9,295 534.1,309 529.1,309" fill="#a8442a" stroke="#2b2118" stroke-width="1"/><line x1="504" y1="428.7" x2="504" y2="345" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="2,3"/><path d="M 504 358.7 A 70 70 0 0 1 519.7 360.5" fill="none" stroke="#a8442a" stroke-width="1.3"/><text x="540" y="356" font-size="12" fill="#a8442a" font-weight="bold">sticks rake 9–17°</text><line x1="462" y1="443.6" x2="462" y2="620" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="2,3"/><path d="M 462 510.6 A 85 85 0 0 0 499.3 502.0" fill="none" stroke="#a8442a" stroke-width="1.3"/><text x="548" y="505" font-size="12" fill="#a8442a" font-weight="bold">back leg rakes 20–30°</text><text x="462" y="118" text-anchor="end" font-size="11.5" fill="#2b2118">crest (comb)</text><line x1="467" y1="121" x2="509" y2="145" stroke="#5a4a3a" stroke-width="0.9"/><text x="618" y="182" font-size="11.5" fill="#2b2118">outer back stick — one piece:</text><text x="618" y="198" font-size="11.5" fill="#2b2118">through seat and arm, up to the crest</text><text x="618" y="216" font-size="10" fill="#5a4a3a" font-style="italic">(the other back sticks are omitted here)</text><line x1="612" y1="190" x2="564.7" y2="196" stroke="#5a4a3a" stroke-width="0.9"/><text x="330" y="268" text-anchor="end" font-size="11" fill="#2b2118">front leg — slight rake,</text><text x="330" y="283" text-anchor="end" font-size="11" fill="#2b2118">wedged proud</text><line x1="334" y1="273" x2="350.9" y2="284" stroke="#5a4a3a" stroke-width="0.9"/><text x="394" y="262" text-anchor="middle" font-size="11" fill="#2b2118">back leg</text><line x1="394" y1="266" x2="394" y2="277" stroke="#5a4a3a" stroke-width="0.9"/><text x="472" y="318.5" text-anchor="middle" font-size="11.5" fill="#2b2118">arm</text><text x="408" y="505" text-anchor="middle" font-size="11" fill="#5a4a3a">seat (slab)</text><text x="408" y="521" text-anchor="middle" font-size="11" fill="#5a4a3a">slight recline</text><line x1="410" y1="492" x2="428" y2="450" stroke="#5a4a3a" stroke-width="0.9"/><text x="585" y="598" font-size="11" fill="#2b2118">foot set well back</text><text x="310" y="648" text-anchor="end" font-size="12" fill="#2b2118" font-weight="bold">← FRONT</text><text x="700" y="648" font-size="12" fill="#2b2118" font-weight="bold">BACK →</text><text x="460.0" y="702" text-anchor="middle" font-size="13.5" fill="#2b2118" font-weight="bold">The arm is carried by through-tenons</text><text x="460.0" y="722" text-anchor="middle" font-size="12.5" fill="#5a4a3a">Its front rides on the front leg, its rear on the outer back stick, and the back leg passes through between them — all wedged.</text><text x="460.0" y="744" text-anchor="middle" font-size="11.5" fill="#5a4a3a" font-style="italic">“The legs protrude through the slab seat to support the arms and are secured with wooden wedges.” — Tasmanian catalogue, 1978</text></svg>