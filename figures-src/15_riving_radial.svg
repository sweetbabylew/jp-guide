="0.55"/><line x1="750.0" y1="488.0" x2="548" y2="488.0" stroke="#a8442a" stroke-width="3.5" marker-end="url(#ahr)"/><text x="850" y="485.0" font-size="12.5" fill="#a8442a" font-weight="bold">AGAINST the lay</text><text x="850" y="502.0" font-size="10.5" fill="#5a4a3a">fur lifts — tears out</text><text x="690.0" y="534" text-anchor="middle" font-size="11" fill="#5a4a3a">If a cut starts to tear, you&#39;re going against the grain — flip the part end-for-end and cut the other way.</text><text x="520.0" y="586" text-anchor="middle" font-size="11.5" fill="#5a4a3a" font-style="italic">When a wedge gets too small to split radially, split it tangentially — along a growth ring (green) — to reach billet size.</text></svg>