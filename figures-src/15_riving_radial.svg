e-width="0.9" opacity="0.5"/><path d="M 864 156 A 62 62 0 0 1 864 244" fill="none" stroke="#c39f6f" stroke-width="0.9" opacity="0.5"/><path d="M 881 139 A 86 86 0 0 1 881 261" fill="none" stroke="#c39f6f" stroke-width="0.9" opacity="0.5"/><path d="M 872 252 A 74 74 0 0 0 891 219" fill="none" stroke="#5b6e4f" stroke-width="2.2"/><circle cx="820" cy="200" r="3.5" fill="#2b2118"/><text x="820" y="306" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">4 · split to size</text><text x="820" y="324" text-anchor="middle" font-size="10.5" fill="#a8442a">radial (rays)</text><text x="820" y="338" text-anchor="middle" font-size="10.5" fill="#5b6e4f">+ tangential (rings)</text><line x1="204" y1="200" x2="266" y2="200" stroke="#2b2118" stroke-width="2.5" marker-end="url(#ah)"/><line x1="434" y1="200" x2="496" y2="200" stroke="#2b2118" stroke-width="2.5" marker-end="url(#ah)"/><line x1="664" y1="200" x2="719" y2="200" stroke="#2b2118" stroke-width="2.5" marker-end="url(#ah)"/><line x1="60" y1="348" x2="980" y2="348" stroke="#c39f6f" stroke-width="1" stroke-dasharray="3,5"/><defs><marker id="ahg" markerWidth="11" markerHeight="11" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6e4f"/></marker></defs><rect x="120" y="394" width="140" height="70" rx="5" fill="#ead8b8" stroke="#2b2118" stroke-width="2.2"/><line x1="120" y1="406" x2="260" y2="406" stroke="#c39f6f" stroke-width="1.6"/><line x1="120" y1="417" x2="260" y2="417" stroke="#c39f6f" stroke-width="1.6"/><line x1="120" y1="429" x2="260" y2="429" stroke="#c39f6f" stroke-width="1.6"/><line x1="120" y1="441" x2="260" y2="441" stroke="#c39f6f" stroke-width="1.6"/><line x1="120" y1="452" x2="260" y2="452" stroke="#c39f6f" stroke-width="1.6"/><text x="190.0" y="386" text-anchor="middle" font-size="12.5" fill="#a8442a" font-weight="bold">the wide face is RADIAL</text><text x="190.0" y="484" text-anchor="middle" font-size="11" fill="#5a4a3a">straight rings → stable, clean</text><text x="690.0" y=