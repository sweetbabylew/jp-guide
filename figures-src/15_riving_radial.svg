<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="1040" height="600" fill="#faf4e8"/><defs><marker id="ah" markerWidth="11" markerHeight="11" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker></defs><text x="520.0" y="40" text-anchor="middle" font-size="24" fill="#2b2118" font-weight="bold">Riving: Splitting Radially, Pith to Bark</text><text x="520.0" y="65" text-anchor="middle" font-size="13.5" fill="#5a4a3a" font-style="italic">Split radially, pith to bark, for a true radial face — on a big log, keep going past quarters to eighths and finer</text><circle cx="120" cy="200" r="78" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><circle cx="120" cy="200" r="71" fill="#d9b98a" stroke="#5a4a3a" stroke-width="1"/><circle cx="120" cy="200" r="23" fill="none" stroke="#c39f6f" stroke-width="0.9" opacity="0.55"/><circle cx="120" cy="200" r="40" fill="none" stroke="#c39f6f" stroke-width="0.9" opacity="0.55"/><circle cx="120" cy="200" r="57" fill="none" stroke="#c39f6f" stroke-width="0.9" opacity="0.55"/><circle cx="120" cy="200" r="3.5" fill="#2b2118"/><text x="120" y="306" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">1 · the log</text><text x="120" y="324" text-anchor="middle" font-size="11" fill="#5a4a3a">end grain, pith centered</text><circle cx="350" cy="200" r="78" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><circle cx="350" cy="200" r="71" fill="#d9b98a" stroke="#5a4a3a" stroke-width="1"/><circle cx="350" cy="200" r="23" fill="none" stroke="#c39f6f" stroke-width="0.9" opacity="0.55"/><circle cx="350" cy="200" r="40" fill="none" stroke="#c39f6f" stroke-width="0.9" opacity="0.55"/><circle cx="350" cy="200" r="57" fill="none" stroke="#c39f6f" stroke-width="0.9" opacity="0.55"/><circle cx="350" cy="200" r="3.5" fill="#2b2118"/><line x1="350" y1="200" x2="350" y2="278" stroke="#a8442a" stroke-wid