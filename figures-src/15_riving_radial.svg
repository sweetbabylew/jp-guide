text x="850" y="411.0" font-size="12.5" fill="#5b6e4f" font-weight="bold">WITH the lay</text><text x="850" y="428.0" font-size="10.5" fill="#5a4a3a">fur smooths down — clean</text><rect x="540" y="466" width="300" height="44" rx="6" fill="#d9b98a" stroke="#2b2118" stroke-width="2.2"/><line x1="550.0" y1="482.2" x2="556.0" y2="472.2" stroke="#a8442a" stroke-width="1.6"/><line x1="570.0" y1="482.2" x2="576.0" y2="472.2" stroke="#a8442a" stroke-width="1.6"/><line x1="590.0" y1="482.2" x2="596.0" y2="472.2" stroke="#a8442a" stroke-width="1.6"/><line x1="610.0" y1="482.2" x2="623.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="630.0" y1="482.2" x2="643.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="650.0" y1="482.2" x2="663.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="670.0" y1="482.2" x2="683.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="690.0" y1="482.2" x2="703.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="710.0" y1="482.2" x2="723.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="730.0" y1="482.2" x2="743.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="750.0" y1="482.2" x2="763.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="770.0" y1="482.2" x2="783.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="790.0" y1="482.2" x2="803.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="810.0" y1="482.2" x2="823.0" y2="476.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="550.0" y1="493.2" x2="556.0" y2="480.2" stroke="#a8442a" stroke-width="1.6"/><line x1="570.0" y1="493.2" x2="576.0" y2="480.2" stroke="#a8442a" stroke-width="1.6"/><line x1="590.0" y1="493.2" x2="596.0" y2="480.2" stroke="#a8442a" stroke-width="1.6"/><line x1="610.0" y1="493.2" x2="623.0" y2="487.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="630.0" y1="493.2" x2="643.0" y2="487.2" stroke="#c39f6f" stroke-width="1.3"/><line x1="650.0" y1="493.2" x2="663.0" y2="487.2" stroke="#c39