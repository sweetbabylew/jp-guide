2="420" stroke="#8a5a2b" stroke-width="0.7" opacity="0.35"/><line x1="215" y1="300" x2="176" y2="404" stroke="#8a5a2b" stroke-width="0.7" opacity="0.35"/><line x1="215" y1="300" x2="147" y2="360" stroke="#8a5a2b" stroke-width="0.7" opacity="0.35"/><line x1="215" y1="300" x2="136" y2="300" stroke="#8a5a2b" stroke-width="0.7" opacity="0.35"/><line x1="215" y1="300" x2="147" y2="240" stroke="#8a5a2b" stroke-width="0.7" opacity="0.35"/><line x1="215" y1="300" x2="175" y2="196" stroke="#8a5a2b" stroke-width="0.7" opacity="0.35"/><line x1="215" y1="300" x2="215" y2="180" stroke="#8a5a2b" stroke-width="0.7" opacity="0.35"/><line x1="215" y1="300" x2="254" y2="196" stroke="#8a5a2b" stroke-width="0.7" opacity="0.35"/><line x1="215" y1="300" x2="283" y2="240" stroke="#8a5a2b" stroke-width="0.7" opacity="0.35"/><circle cx="215" cy="300" r="4.5" fill="#2b2118"/><text x="228" y="293" font-size="10.5" fill="#5a4a3a">pith</text><line x1="215" y1="300" x2="215" y2="164" stroke="#2b2118" stroke-width="1.6"/><line x1="215" y1="305" x2="215" y2="435" stroke="#a8442a" stroke-width="3" stroke-dasharray="2,6"/><polygon points="138,194 218,203 218,213 138,222" fill="#9aa0a6" stroke="#2b2118" stroke-width="2"/><rect x="129" y="192" width="9" height="32" rx="2" fill="#7d7f84" stroke="#2b2118" stroke-width="1.6"/><line x1="215" y1="212" x2="215" y2="254" stroke="#a8442a" stroke-width="2.5"/><line x1="58" y1="208" x2="116" y2="208" stroke="#2b2118" stroke-width="4" marker-end="url(#ah)"/><text x="36" y="190" font-size="13" fill="#2b2118">sledge blow</text><text x="48" y="108" font-size="14" fill="#2b2118">steel wedge, on the scored line</text><text x="48" y="126" font-size="11" fill="#5a4a3a">(start ~⅓ of the radius in — not at the edge)</text><line x1="152" y1="132" x2="150" y2="194" stroke="#5a4a3a" stroke-width="1"/><text x="300" y="150" font-size="11.5" fill="#2b2118">score pith → bark (thin knife line)</text><line x1="302" y1="155" x2="218" y2="184" stroke="#5a4a3a" stroke-width="1"/><text x="215" y="478" text-anchor="middle" font-size="14" fill="#a8442a">split runs pith → bark, following the rays</text><text x="215" y="500" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">halve, then quarter — keep equal mass either side</text><text x="660" y="148" text-anchor="middle" font-size="15" fill="#2b2118" font-weight="bold">Leap-frog the wedges along the crack</text><path d="M487,248 L838,248 A17 57 0 0 1 838,362 L487,362 Z" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><line x1="500" y1="286" x2="838" y2="286" stroke="#5a4a3a" stroke-width="0.9" opacity="0.3"/><line x1="500" y1="324" x2="838" y2="324" stroke="#5a4a3a" stroke-width="0.9" opacity="0.3"/><ellipse cx="487" cy="305.0" rx="17" ry="57" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><line x1="487" y1="305.0" x2="499" y2="305" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="487" y1="305.0" x2="495" y2="340" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="487" y1="305.0" x2="487" y2="355" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="487" y1="305.0" x2="479" y2="340" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="487" y1="305.0" x2="475" y2="305" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="487" y1="305.0" x2="479" y2="270" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="487" y1="305.0" x2="487" y2="255" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><line x1="487" y1="305.0" x2="495" y2="270" stroke="#5a4a3a" stroke-width="0.8" opacity="0.6"/><polygon points="483,248 491,248 487,305.0" fill="#3a2d20"/><line x1="487" y1="305.0" x2="487" y2="358" stroke="#a8442a" stroke-width="2"/><path d="M504,243.5 Q630,246 745,248 Q630,251 504,252.5 Z" fill="#3a2d20"/><line x1="745" y1="248" x2="828" y2="248" stroke="#a8442a" stroke-width="2" stroke-dasharray="3,5"/><polygon points="518.0,192 542.0,192 534.0,251 526.0,251" fill="#9aa0a6" stroke="#2b2118" stroke-width="1.8" opacity="1.0" transform="rotate(-7 530 251)"/><text x="508" y="206" text-anchor="end" font-size="12" fill="#2b2118">1</text><polygon points="575.0,206 609.0,206 599.0,252 585.0,252" fill="#c39f6f" stroke="#2b2118" stroke-width="1.8" opacity="1.0"/><text x="592" y="198" text-anchor="middle" font-size="11" fill="#5a4a3a">glut</text><polygon points="644.0,213 666.0,213 660.0,250 650.0,250" fill="#9aa0a6" stroke="#2b2118" stroke-width="1.8" opacity="1.0"/><text x="639" y="226" text-anchor="end" font-size="12" fill="#2b2118">2</text><polygon points="710.0,224 730.0,224 726.5,249 713.5,249" fill="#9aa0a6" stroke="#2b2118" stroke-width="1.8" opacity="1.0"/><text x="705" y="236" text-anchor="end" font-size="12" fill="#2b2118">3</text><path d="M712,249 l-10,4 M728,249 l10,4" stroke="#2b2118" stroke-width="1" fill="none" opacity="0.6"/><polygon points="778.0,206 802.0,206 794.0,248 786.0,248" fill="none" stroke="#2b2118" stroke-width="1.8" stroke-dasharray="4,3" opacity="0.85"/><text x="790" y="230" text-anchor="middle" font-size="12" font-style="italic" fill="#5a4a3a">1</text><path d="M528,186 Q660,152 786,200" fill="none" stroke="#a8442a" stroke-width="2.2" marker-end="url(#ahr)"/><text x="660" y="166" text-anchor="middle" font-size="11.5" fill="#a8442a">wedge 1 leaps ahead</text><text x="660" y="400" text-anchor="middle" font-size="13" fill="#5a4a3a">As the crack opens, move the freed wedge ahead of the others.</text><text x="660" y="420" text-anchor="middle" font-size="13" fill="#5a4a3a">Gluts (big wooden wedges) widen the gap — keep them off cross-fibers.</text><text x="450.0" y="544" text-anchor="middle" font-size="12" fill="#5a4a3a" font-style="italic">Riven (split) parts follow the wood&#39;s long fibers — far stronger than sawn parts, and easier to shave true. (Langsner; Alexander)</text></svg>