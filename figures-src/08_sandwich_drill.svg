<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="900" height="560" fill="#faf4e8"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker></defs><text x="450.0" y="38" text-anchor="middle" font-size="24" fill="#2b2118" font-weight="bold">Section 4 · “Sandwich” (Stack) Drilling the Arm</text><text x="450.0" y="64" text-anchor="middle" font-size="13.5" fill="#5a4a3a" font-style="italic">Drill arm and seat in one pass so their holes line up perfectly at assembly</text><rect x="210" y="140" width="480" height="34" rx="5" fill="#ead8b8" stroke="#2b2118" stroke-width="2.5"/><text x="702" y="161.0" font-size="13" fill="#2b2118">backrest</text><rect x="210" y="184" width="480" height="34" rx="5" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><text x="702" y="205.0" font-size="13" fill="#2b2118">arm</text><rect x="210" y="228" width="480" height="40" rx="5" fill="#c39f6f" stroke="#2b2118" stroke-width="2.5"/><text x="702" y="252.0" font-size="13" fill="#2b2118">seat</text><rect x="240" y="128" width="16" height="152" rx="4" fill="none" stroke="#2b2118" stroke-width="3"/><rect x="234" y="128" width="28" height="10" rx="3" fill="#5a4a3a"/><rect x="234" y="270" width="28" height="10" rx="3" fill="#5a4a3a"/><rect x="644" y="128" width="16" height="152" rx="4" fill="none" stroke="#2b2118" stroke-width="3"/><rect x="638" y="128" width="28" height="10" rx="3" fill="#5a4a3a"/><rect x="638" y="270" width="28" height="10" rx="3" fill="#5a4a3a"/><text x="248" y="298" text-anchor="middle" font-size="11" fill="#5a4a3a">clamp</text><line x1="450.0" y1="268" x2="410" y2="78" stroke="#8a8f94" stroke-width="6"/><line x1="390" y1="48" x2="444" y2="138" stroke="#2b2118" stroke-width="2" stroke-dasharray="2,4" marker-end="url(#ah)"/><text x="410" y="68" text-anchor="middle" font-size="12.5" fill="#2b2118">brace &amp; bit (one bore, all layers)</text><line x1="450.0" y1="268" x2="450.0" y2="110" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="2,3"/><path d="M450.0 130 A 60 60 0 0 0 438 131" fill="none" stroke="#a8442a" stroke-width="1.4"/><text x="406.0" y="100" font-size="12.5" fill="#a8442a" font-weight="bold">back tilt (set by bevel)</text><rect x="170" y="286" width="600" height="26" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><text x="702" y="304" font-size="12" fill="#5a4a3a">bench (back hangs off edge)</text><text x="450.0" y="482" text-anchor="middle" font-size="14" fill="#2b2118" font-weight="bold">Then account for the rise &amp; run</text><text x="450.0" y="504" text-anchor="middle" font-size="12.5" fill="#5a4a3a">A back-leaning stick travels rearward as it climbs. With the arm at sitting height, the stick&#39;s top</text><text x="450.0" y="522" text-anchor="middle" font-size="12.5" fill="#5a4a3a">sits a measured distance behind the seat hole — so slide the arm back that much before drilling it.</text><text x="450.0" y="546" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">Idea credited to “Rudy”: stack the parts and drill them all at once. (Schwarz, The American Peasant) · cf. Lewis&#39;s “sandwich drill the outer spindles.”</text></svg>