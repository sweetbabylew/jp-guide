<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="980" height="580" fill="#faf4e8"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b2118"/></marker></defs><text x="490.0" y="34" text-anchor="middle" font-size="22" fill="#2b2118" font-weight="bold">Fitting a Leg to the Seat Mortise — the Scribed Shoulder</text><text x="490.0" y="57" text-anchor="middle" font-size="12.5" fill="#5a4a3a" font-style="italic">A conical leg in a cylindrical hole: jam it, read where it meets the seat bottom, then shape to fit</text><text x="130" y="100" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">1 · Jam it in</text><rect x="64" y="210" width="132" height="52" fill="#d9b98a" stroke="#2b2118" stroke-width="2"/><line x1="118" y1="210" x2="118" y2="262" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/><line x1="142" y1="210" x2="142" y2="262" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/><text x="70" y="204" font-size="9.5" fill="#5a4a3a">seat</text><polygon points="122,150 138,150 138,210 152,400 108,400 122,210" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><polygon points="118,262 118,210 122,210" fill="#2b2118" stroke="#2b2118" stroke-width="1"/><polygon points="142,262 142,210 138,210" fill="#2b2118" stroke="#2b2118" stroke-width="1"/><text x="158" y="160" font-size="10" fill="#2b2118">round the top,</text><text x="158" y="173" font-size="10" fill="#2b2118">tap it up to jam</text><text x="130" y="425" text-anchor="middle" font-size="9.5" fill="#5a4a3a">cone wedges at the seat bottom</text><text x="370" y="100" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">2 · Mark two lines</text><rect x="304" y="210" width="132" height="52" fill="#d9b98a" stroke="#2b2118" stroke-width="2"/><line x1="358" y1="210" x2="358" y2="262" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/><line x1="382" y1="210" x2="382" y2="262" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/><text x="310" y="204" font-size="9.5" fill="#5a4a3a">seat</text><polygon points="362,150 378,150 378,210 392,400 348,400 362,210" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><polygon points="358,262 358,210 362,210" fill="#2b2118" stroke="#2b2118" stroke-width="1"/><polygon points="382,262 382,210 378,210" fill="#2b2118" stroke="#2b2118" stroke-width="1"/><text x="442" y="194" font-size="9" fill="#5a4a3a">gaps: round hole,</text><text x="442" y="205" font-size="9" fill="#5a4a3a">cone leg</text><line x1="446" y1="208" x2="386" y2="218" stroke="#5a4a3a" stroke-width="0.9" marker-end="url(#ah)"/><line x1="355" y1="262" x2="385" y2="262" stroke="#a8442a" stroke-width="2.5"/><text x="390" y="260" font-size="10" fill="#a8442a" font-weight="bold">future top of tenon</text><text x="390" y="273" font-size="9" fill="#a8442a">(visible from above)</text><line x1="351" y1="314" x2="389" y2="314" stroke="#5b6e4f" stroke-width="2.5"/><text x="394" y="318" font-size="10" fill="#5b6e4f" font-weight="bold">shoulder line</text><line x1="336" y1="262" x2="342" y2="314" stroke="#5a4a3a" stroke-width="1" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="338" y="291" text-anchor="end" font-size="8.5" fill="#5a4a3a">1 seat-</text><text x="338" y="301" text-anchor="end" font-size="8.5" fill="#5a4a3a">thickness</text><text x="610" y="100" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">3 · Saw, then pare</text><polygon points="594,314 626,314 632,400 588,400" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><polygon points="602,150 618,150 618,210 622,262 598,262 602,210" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><rect x="598" y="262" width="24" height="52" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><line x1="594" y1="314" x2="626" y2="314" stroke="#2b2118" stroke-width="1"/><line x1="591" y1="314" x2="629" y2="314" stroke="#5b6e4f" stroke-width="2.5"/><line x1="595" y1="262" x2="625" y2="262" stroke="#a8442a" stroke-width="2.5"/><text x="590" y="256" text-anchor="end" font-size="10" fill="#a8442a" font-weight="bold">the red line —</text><text x="590" y="268" text-anchor="end" font-size="10" fill="#a8442a" font-weight="bold">don&#39;t mar it</text><text x="586" y="318" text-anchor="end" font-size="10" fill="#5b6e4f" font-weight="bold">light saw kerf</text><polygon points="623,304 648,272 655,277 630,309" fill="#9aa0a6" stroke="#2b2118" stroke-width="1.6"/><line x1="652" y1="274" x2="670" y2="250" stroke="#8a6b4a" stroke-width="9" stroke-linecap="round"/><path d="M624,305 q 14,0 13,10 q -1,9 -10,9 q -7,0 -8,-6" fill="none" stroke="#c39f6f" stroke-width="1.8"/><text x="662" y="302" font-size="10" fill="#2b2118">chisel or drawknife:</text><text x="662" y="315" font-size="10" fill="#2b2118">pare red → green</text><text x="610" y="420" text-anchor="middle" font-size="9.5" fill="#5a4a3a">saw the green line lightly, then pare down to it</text><text x="610" y="433" text-anchor="middle" font-size="9.5" fill="#5a4a3a">— don&#39;t mar the red line</text><text x="850" y="100" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">4 · Seated tight</text><rect x="784" y="210" width="132" height="52" fill="#d9b98a" stroke="#2b2118" stroke-width="2"/><line x1="838" y1="210" x2="838" y2="262" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/><line x1="862" y1="210" x2="862" y2="262" stroke="#5a4a3a" stroke-width="1" stroke-dasharray="3,2"/><text x="790" y="204" font-size="9.5" fill="#5a4a3a">seat</text><rect x="839" y="150" width="22" height="112" fill="#c39f6f" stroke="#2b2118" stroke-width="2"/><polygon points="838,262 862,262 872,400 828,400" fill="#ead8b8" stroke="#2b2118" stroke-width="2"/><line x1="835" y1="262" x2="865" y2="262" stroke="#5b6e4f" stroke-width="2.5"/><text x="884" y="288" font-size="10" fill="#5b6e4f" font-weight="bold">shoulder seats</text><line x1="888" y1="278" x2="868" y2="264" stroke="#5b6e4f" stroke-width="1"/><text x="850" y="142" text-anchor="middle" font-size="9.5" fill="#5a4a3a">proud, ready to wedge</text><text x="490.0" y="508" text-anchor="middle" font-size="13.5" fill="#2b2118" font-weight="bold">Let the wood tell you where to cut</text><text x="490.0" y="528" text-anchor="middle" font-size="12" fill="#5a4a3a">The cone jams at the seat&#39;s bottom face — mark it in RED and never mar it: that&#39;s the future top of the tenon. Scribe the GREEN line one seat-thickness toward the foot.</text><text x="490.0" y="546" text-anchor="middle" font-size="12" fill="#5a4a3a">Saw the GREEN line lightly, pare the band between the lines down to it, then drive the leg up until the shoulder seats against the bottom of the seat.</text><text x="490.0" y="566" text-anchor="middle" font-size="11" fill="#a8442a" font-style="italic">Photographs of these steps appear in this section.</text></svg>