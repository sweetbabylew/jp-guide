<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Georgia, 'Times New Roman', serif">
<rect x="0" y="0" width="900" height="420" fill="#faf4e8"/><defs><marker id="ahr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#a8442a"/></marker></defs><text x="450.0" y="40" text-anchor="middle" font-size="23" fill="#2b2118" font-weight="bold">Tapering a Leg</text><text x="450.0" y="64" text-anchor="middle" font-size="13" fill="#5a4a3a" font-style="italic">Taper to 1″ at the top, starting 20″ down — while the leg is still four-sided</text><polygon points="110,190.75 347,190.75 820,199.0 820,221.0 347,229.25 110,229.25" fill="#d9b98a" stroke="#2b2118" stroke-width="2.5"/><line x1="110" y1="200" x2="347" y2="200" stroke="#c39f6f" stroke-width="0.8" opacity="0.5"/><line x1="110" y1="220" x2="347" y2="220" stroke="#c39f6f" stroke-width="0.8" opacity="0.5"/><text x="110" y="259.25" text-anchor="middle" font-size="12.5" fill="#2b2118" font-weight="bold">foot (bottom)</text><text x="820" y="251.0" text-anchor="middle" font-size="12.5" fill="#2b2118" font-weight="bold">top</text><line x1="96" y1="190.75" x2="96" y2="229.25" stroke="#5a4a3a" stroke-width="1" marker-start="url(#ahr)" marker-end="url(#ahr)"/><text x="90" y="214" text-anchor="end" font-size="12" fill="#2b2118">1¾″</text><line x1="834" y1="199.0" x2="834" y2="221.0" stroke="#5a4a3a" stroke-width="1" marker-start="url(#ahr)" marker-end="url(#ahr)"/><text x="840" y="214" text-anchor="start" font-size="12" fill="#2b2118">1″</text><line x1="347" y1="164.75" x2="347" y2="239.25" stroke="#a8442a" stroke-width="1.4" stroke-dasharray="4,3"/><text x="347" y="158.75" text-anchor="middle" font-size="12" fill="#a8442a" font-weight="bold">taper begins 20″ from the top</text><line x1="347" y1="176.75" x2="820" y2="176.75" stroke="#a8442a" stroke-width="1.2" marker-start="url(#ahr)" marker-end="url(#ahr)"/><text x="583" y="172.75" text-anchor="middle" font-size="11" fill="#a8442a">20″ of taper</text><text x="268" y="279.25" text-anchor="middle" font-size="11" fill="#5a4a3a">full thickness below the line</text><text x="450.0" y="374" text-anchor="middle" font-size="13" fill="#2b2118" font-weight="bold">Taper while four-square, then octagonalize</text><text x="450.0" y="394" text-anchor="middle" font-size="12" fill="#5a4a3a">It is easier to judge a straight taper on flat faces. A hair of convexity along the taper looks “just right.”</text><text x="450.0" y="412" text-anchor="middle" font-size="11" fill="#5a4a3a" font-style="italic">(Back sticks taper the same way — to ¾″ at the top.)</text></svg>